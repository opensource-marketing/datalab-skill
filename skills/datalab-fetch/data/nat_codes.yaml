# 방한 통계의 국가 코드 — natCd 파라미터에 넣는 값이다.
#
# 데이터랩 API가 스스로 돌려준 값을 그대로 모은 것이다
# (NAT_08_01_021을 natCd=999로 불러 PTL_NAT_CD와 NAT_NM을 짝지었다).
# 우리가 지은 이름은 하나도 없다.
#
# 국가가 아닌 코드도 섞여 있다: 924 아시아 기타, 943 교포, 940 국적미상 등.
# 데이터랩이 국가와 같은 축에 놓고 집계하므로 여기서도 지우지 않는다.
#
# 주의: 외래관광객조사 계열 지표(NAT_07_01_018 등)는 조사 대상국이
# 20개국 안팎이다. 여기 있는 코드라고 그 지표에서 값이 나오지는 않는다.
# 생성: 2026-08-21 / 215개

