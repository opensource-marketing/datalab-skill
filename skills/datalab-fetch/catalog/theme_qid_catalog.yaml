  screen: /datalab/portal/theme/getNightTourSearch.do
  auth: public
  params: [SGG_CD, BASE_YM1, BASE_YM2, srchAreaDate, tabDiv]
  fixed_params: {srchAreaDate: "1", tabDiv: "1"}
