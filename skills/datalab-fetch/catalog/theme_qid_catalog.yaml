  query_axis: 해양
  caution: >-
    배열 파라미터가 필요하다(`marine.params_for` 가 만든다).
    **해양관광객만 골라낸 값이 아니다** — 강릉시 21개 동 중 17개가
    성·연령 조회의 읍면동 방문자와 값이 같다(2026-08-24 확인).
