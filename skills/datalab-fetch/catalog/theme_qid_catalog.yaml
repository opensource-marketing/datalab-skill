BY_TH_MARINE_101_001:
  name: 연안 읍면동별 방문자 수
  screen: /datalab/portal/theme/getMarineTourSearch.do
  auth: public
  params: [SGG_CD, BASE_YM1, BASE_YM2, srchAreaDate, tabDiv, srchDivType]
