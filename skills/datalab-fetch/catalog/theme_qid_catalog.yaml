# 한국관광 데이터랩 qid 카탈로그 — 테마 관광(야간·의료)
#
# `{SKILLS_DIR}` = 이 스킬들이 설치된 디렉토리(이 스킬 폴더의 부모). 소스
# 저장소와 배포본에서 실제 설치 위치가 다르므로, 아래 명령을 그대로 쓰기
# 전에 이 값을 자신의 설치 경로로 바꿔라.
#
# 다른 카탈로그와 조회 축이 다르다. 섞어 쓰면 빈 배열만 받는다.
#
# 각 항목의 query_axis 필드가 조회 축을 못 박는다.
# (인바운드 카탈로그의 axis는 스코어링 축 목록이라 뜻이 다르다. 섞지 마라.) 파라미터 이름만 보고 추론하면
# 틀린다 — 의료관광은 NAT_CD를 fixed_params로 보내지만 국가 축이 아니고,
# 야간관광은 SGG_CD를 쓰지만 시군구 축이 아니다.
#
#   해양관광  BY_TH_MARINE_*      시군구 다섯 자리 + **배열 파라미터**가 필요하다.
#                                  scripts/marine.py 로 만든다(두 단계 호출).
#   MICE     BY_TH_MICE_*        축이 없다(전국 고정). srchEventDivCd로 행사
#                                  유형을, srchRsdeDivCd로 거주지 구분을 고른다.
#   한류관광  BY_TH_KOR_WAVE_*    NAT_CD에 **한글 국가명**을 넣는다("글로벌",
#                                  "일본", "중국"…). 코드가 아니다.
#                                  설문 기반이라 기간이 연 단위다.
#   야간관광  BY_TH_NIGHT_TOUR_*  SGG_CD에 **시도 두 자리**를 넣는다.
#                                  시군구 다섯 자리와 전국(98)은 빈 배열이다.
#   의료관광  BY_TH_MEDIC_*       조회 축이 **없다**. 전국 값만 나온다.
#                                  SGG_CD·NAT_CD를 받지만 무시한다.
#
# ── 의료관광이 축을 무시한다는 근거 ─────────────────────────────
# 추측이 아니다. 화면 JS가 호출 직전에 스스로 값을 지운다:
#   params2 = assign(params2, {qid:"", SGG_CD:"", SGG_NM:"", NAT_CD:"", ...});
# 실호출로도 확인했다. SGG_CD를 11/27/51로 바꿔도, NAT_CD를 000/392/111로
# 바꿔도 응답이 한 글자도 달라지지 않는다. 지역·국가 선택은 화면에서만
# 걸러 쓰는 장치다.
# ────────────────────────────────────────────────────────────────
#
# ── 단위가 지표마다 다르다 ─────────────────────────────────────
# BY_TH_MEDIC_002_001_AMT 는 **천원**, BY_TH_MEDIC_002_002_AMT 와
# 002_003_AMT 는 **원**이다. 같은 달의 같은 금액을 놓고 정확히 1000.0000배
# 차이가 나는 것을 확인했다(2024-01: 55,132,709 대 55,132,709,115).
# 단위를 확인하지 않고 두 지표를 나란히 놓으면 1000배 틀린다.
# 단위 출처는 사이트 차트 정의(unit: '천원')다.
# ────────────────────────────────────────────────────────────────
#
# ── 야간관광의 구분(LRFRN_DIV) 값이 지표마다 다르다 ──────────
#   001_001 / 001_002 : 내국인(1) · 외국인(2)                      → 2종
#   002_001            : 현지인(0) · 외지인(1) · 외국인(2)          → 3종
#   002_002            : 현지인(0) · 외지인(1) · 외국인(2) · 내국인(3) → 4종
#
# 002_002에서 현지인 + 외지인 = 내국인 임을 12개월 전부 검산해 확인했다
# (강원 2024년, 오차 1원 미만). 그러므로 002_002의 행을 모두 더하면
# 내국인을 두 번 세게 된다. 구분을 골라 쓰라.
# ────────────────────────────────────────────────────────────────

BY_TH_NIGHT_TOUR_001_001:
