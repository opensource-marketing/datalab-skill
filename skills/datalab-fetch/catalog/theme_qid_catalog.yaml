  section: 야간
  query_axis: 시도
  caution: SGG_CD는 시도 두 자리다.
  columns:
    DT: {label: 기준월, type: str, unit: ""}
    LRFRN_DIV_CD: {label: 구분코드, type: str, unit: ""}
    LRFRN_DIV_NM: {label: 구분, type: str, unit: ""}
    NIGHT_TOU_NUM: {label: 야간_방문객수, type: float, unit: 명}
    TOU_NUM: {label: 전체_방문객수, type: float, unit: 명}
    RATE_NUM: {label: 야간_비율, type: float, unit: "%"}

