  fixed_params: {}
  probe_window: ["2018", "2023"]   # 창이 고정이다. 끝을 2024로만 바꿔도 빈 배열
  granularity: year
  section: 프로파일링
  query_axis: 지역
  caution: >-
    **2018~2023으로 불러야 한다.** 그렇게 불러도 마지막 해(2023)만 온다.
    GRP_NM이 산업 분류이고, **그 목록 안에 '관광산업'이 한 행으로 들어
    있다**(GRP_CD가 '?'). 표준산업분류 코드를 가진 다른 행들과 겹치지
    않는다 — 정선군 2023에서 스무 행의 EMPLY_NUM 합이 TOT_TOU_NUM
    (14,039명 · 2026-08-23 재확인)과 정확히 같고 RATE_VAL 합이 99.98이다. 그러므로 더해도
    두 번 세지 않는다. 다만 **다른 열아홉 행은 관광 지표가 아니다** —
    건설업·공공행정을 관광 성과로 읽지 마라.
    관광산업 한 행의 RATE_VAL이 "이 지역 일자리 가운데 관광이 차지하는
    몫"이다(정선군 2023: 22.74%).
