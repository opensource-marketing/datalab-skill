    POPL_DCRS_REGN_YN: {label: 인구감소지역여부, type: str, unit: ""}
    POPL_DCRS_ITS_REGN_YN: {label: 관심지역여부, type: str, unit: ""}
    GRP_NM: {label: 지표명, type: str, unit: ""}
    TOU_DIV_NM: {label: 구분, type: str, unit: ""}
    AVG_TOU_NUM: {label: 값, type: float, unit: ""}
    COL_FIELD: {label: 항목코드, type: str, unit: ""}
    GRP_CD: {label: 지표코드, type: str, unit: ""}
    SIDO_CD: {label: 시도코드, type: str, unit: ""}
    SGG_CD: {label: 시군구코드, type: str, unit: ""}
