    춘천(51110)과 강원(51)의 응답이 완전히 같다(2026-08-24 확인) —
    "강릉시 검색건수"인 줄 알고 강원도 시군구 표를 읽게 된다.
    전국(98)은 229행으로 전국 시군구를 준다.
    **SPPY_SRCH_CNT 와 GROW_RATE_SPPY_SRCH_CNT 는 늘 0이다.**
    검색 건수이지 방문자 수가 아니다.
