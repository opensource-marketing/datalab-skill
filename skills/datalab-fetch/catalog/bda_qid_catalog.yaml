# 한국관광 데이터랩 qid 카탈로그 — 빅데이터(이동통신·신용카드·내비게이션)
#
# ── 이 카탈로그가 늦게 생긴 이유 ────────────────────────────────
# 이 지표들이 있는 화면(빅데이터 메뉴)은 **로그인해야 열린다.** 화면을
# 못 열면 그 안의 qid를 알 수 없어서, 색인이 화면 마흔 곳을 훑는 동안
# 이 영역이 통째로 비어 있었다.
#
# 그런데 **데이터 API 자체는 공개다.** 로그인해서 얻은 qid와 파라미터를
# 그대로 익명으로 다시 불러 27건이 모두 같은 값을 돌려주는 것을
# 확인했다(263행 → 263행, 242행 → 242행). 그래서 이 카탈로그의 지표는
# 전부 auth: public 이고, 쓰는 사람은 로그인할 필요가 없다.
# ────────────────────────────────────────────────────────────────
#
# ── SGG_CD에 시도 두 자리를 넣는다 ─────────────────────────────
# 이름은 SGG_CD지만 이 계열은 **시도 두 자리**를 본다. 시군구 다섯
# 자리를 넣으면 지표에 따라 셋 중 하나가 일어난다:
#
#   빈 배열       BDT_01_01_001 · BDT_02_01_002_31 · _32 · _35 · BDT_03_01_002_3 · _4
#   앞 두 자리만  BDT_01_01_002 · BDT_02_01_002_33
#                 (강릉 51150을 넣어도 춘천 51110을 넣어도 응답이 같다.
#                  해시까지 같은 것을 확인했다. 시군구를 고른 것이 아니라
#                  그 시도 안의 시군구 목록을 받은 것이다)
#   시군구로 동작  BDT_01_01_003_4 · BDT_01_01_004_3_5 · BDT_03_01_001_2
#
# 각 항목의 query_axis가 무엇을 넣어야 하는지 못 박는다. 이름만 보고
# 시군구를 넣으면 "그 지역 값"인 줄 알고 시도 값을 읽게 된다.
#
# 전국은 98이다. 다만 98을 받는 지표는 일부다(caution에 적었다).
#
# ── touDivCd: 방문자 구분 ──────────────────────────────────────
# **같은 이름인데 지표군마다 코드 체계가 다르다.** 이 카탈로그에서
# 가장 조용히 틀리는 자리다 — 틀린 코드를 보내도 오류가 아니라
# 기본값으로 처리되어 다른 집단의 값이 그대로 실린다.
#
# 이동통신 방문자(BDT_01_*). **2026-08-24에 1의 뜻을 고쳤다.**
#
#   1 현지인(a)       71,155,266   ← 한동안 '전체'로 잘못 적혀 있었다
#   2 외지인(b)       34,827,352
#   3 외국인(c)          393,086
#   4 외부방문자(b+c)  35,220,438   ← 2 + 3 과 정확히 일치
#
# 근거 셋이 같은 곳을 가리킨다(강원 2025-08~2026-07, 강릉시).
#
# **화면 코드가 키와 라벨을 짝지어 둔다**(metco_ana_chart.js):
#   JURI_TOU_NUM 현지인(a) · OJURI_TOU_NUM 외지인(b) ·
#   FRN_TOU_NUM 외국인(c) · JURI_OJURI_TOTL_TOU_NUM 외부방문자(b+c) ·
#   TOTL_TOU_NUM 전체방문자(a+b+c)
# touDivCd 1·2·3·4 가 이 순서와 맞는다.
#
# **형제 지표와 값이 맞아떨어진다.** BDT_01_01_004_4 는 구분을
# TOU_DIV_NM 컬럼으로 나눠 주는데, 거기서 현지인방문자(a)가
# 71,155,266 으로 touDivCd=1 과 같다. 외지인도 34,827,351 로 같다.
#
# **덧셈이 맞는다.** 1 + 2 = 105,982,618 이고 004_4 의
# '전체방문자(a+b)' 가 105,982,616 이다(오차 2, 반올림).
#
# ── 그래서 "전체 방문자"는 touDivCd 로 부를 수 없다 ────────────
# 1 을 전체로 읽으면 강릉시 2024년 방문자가 68,224,356 명이 되는데
# 실제 전체(a+b)는 101,457,694 명이다 — **33% 적게 말하게 된다.**
# 종로구는 56,238,098 대 194,581,537 로 3.5배 차이다.
# 전체가 필요하면 BDT_01_01_004_4 의 '전체방문자(a+b)' 행을 쓰라.
#
# **관광 맥락에서는 4(외부방문자)가 맞다.** 현지인을 빼야 관광객이
# 되기 때문이다. 그래서 BDT_01_01_001·002 의 기본값을 1에서 4로
# 바꿨다(2026-08-24).
#
# 신용카드 소비(BDT_02_*). 화면의 select 옵션에서 읽고 산술로 확인했다
# (강원 2024년, 시군구 18곳 합계):
#
#   0 현지인(a)      230,003,396
#   1 외지인(b)    4,939,740,735
#   2 내국인(a+b)  5,169,744,131  ← 0 + 1 과 일치(오차 1)
#
# **소비 지표에 3이나 4를 보내면 기본값(2)으로 처리된다.** 오류가 나지
# 않으므로 알아채기 어렵다 — 현지인이 섞여 순위가 바뀐다(강원 지출액
# 1위가 강릉시가 아니라 원주시가 된다).
#
# 그러므로 1과 2·3·4를 더하면 두 번 센다. 하나를 골라 써라.
# 월별 추이 지표(BDT_01_01_003_4 등)는 touDivCd를 **무시하고** 구분을
# TOU_DIV_NM 컬럼으로 나눠서 한꺼번에 준다.
#
# ── 단위 ────────────────────────────────────────────────────────
# 이동통신 방문자 수  명  (차트 정의 ' 명')
# 신용카드 지출액     천원 (차트 정의 ' 천원')  ← 원이 아니다
# 내비게이션 검색건수 건  (차트 정의 ' 건')
#
# ── 신용카드 계열에서 넣지 않기로 한 것 (2026-08-24) ───────────
# `BDT_02_01_*` 은 색인에 93개가 있는데 카탈로그에는 다섯뿐이다.
# 나머지를 열어 보려고 축 네 가지(전국 '' · 시도 · 시군구 · 98)를
# 다 두들겨 55개에서 값을 받아 냈다. 그런데 **넣지 않았다.**
#
# 이유가 둘이다.
#
# **1. `_003_*` 과 `_005_*` 는 touDivCd 를 무시한다.** 0·1·2·3·4를
# 넣어도 응답이 똑같다(2026-08-24 확인). 그러면서 값이 이미 검증된
# `_002_*` 와 맞지 않는다 — 강원 2024년이 `002_33` 은 5,169,744,131
# 천원인데 `003_1` 은 653,286,712천원이다(8배 차이).
# 외국인 카드소비인가 싶어 전국 시도를 모두 더해 봤지만
# 22,831,733,053천원으로 `NAT_11_02_001`(외국인 2024년
# 12,112,160,438,675원)의 1.885배라 그것도 아니다.
# **무엇을 세는지 확정하지 못했다.** 값이 오고 그럴듯해서 더 위험하다.
#
# **2. `_4x`(외국인 신한카드) 계열은 0바이트를 준다.** 화면 코드는
# 아직 `BDT_02_01_001_41`·`002_41`·`003_41` 을 부르는데 서버가 빈
# 본문을 돌려준다. `TB_CD` 를 1·2·3·4·6 으로 바꿔 봐도 같다
# (2026-08-24 확인). 데이터랩이 시군구 내국인 카드소비 계열을
# 내렸던 것처럼 이 계열도 내려간 것으로 보인다.
#
# 다시 열어 보려는 사람은 여기서부터 시작하면 된다.
#
# ── 내비게이션 계열의 전년동기 컬럼은 비어 있다 ────────────────
# `SPPY_SRCH_CNT` 와 `GROW_RATE_SPPY_SRCH_CNT` 가 **늘 0이다.**
# BDT_03_01_* 여섯 지표를 2023·2025·2026년 세 기간에서 확인했는데
# 0이 아닌 행이 하나도 없었다(2026-08-24). 컬럼은 있지만 값이
# 들어오지 않는다.
#
# **오류도 빈 배열도 아니라서 그대로 나눗셈에 들어간다** — 증감률을
# 계산하면 -100%가 되거나 0으로 나누게 된다. 전년 대비를 보려면
# 기간을 두 번 불러 직접 견주어라.
#
# 신용카드가 천원인 것이 특히 위험하다. 다른 카탈로그에는 원 단위
# 소비 지표가 있어서, 그대로 나란히 놓으면 1000배 틀린다.
#
# ── 방문자 수는 연인원이다 ─────────────────────────────────────
# 한 사람이 여러 번 가면 여러 번 센다. 강릉시 2025-08~2026-07 전체
# 방문자가 7,115만 명인 것이 그 때문이다. 인구와 비교하지 마라.
# ────────────────────────────────────────────────────────────────

BDT_01_01_001:
  name: 시도 관광 방문자 수(요약)
  screen: /datalab/portal/bda/getMetcoAna.do
  auth: public
  params: [SGG_CD, BASE_YM1, BASE_YM2, touDivCd]
  fixed_params: {srchAreaDate: "1", tabDiv: "1", srchLocation: "1",
                 sggIntgYnFlag: "N", touDivCd: "4"}
  granularity: period
  section: 이동통신
  query_axis: 시도
  caution: >-
    **touDivCd를 보내지 않으면 오류가 아니라 빈 배열이 온다.**
    이동통신 체계다 — **1 현지인(a)** · 2 외지인(b) · 3 외국인(c) ·
    4 외부방문자(b+c). **1은 전체가 아니다**(2026-08-24 정정 — 그전에는
    '전체'로 적혀 있었다). 여기서는 관광 맥락에 맞게 4로 고정해 두었다.
    현지인까지 넣은 전체가 필요하면 BDT_01_01_004_4 의
    '전체방문자(a+b)' 행을 쓰라 — touDivCd 로는 부를 수 없다. 시도 두 자리를 넣으면 그 시도
    한 행이, 98을 넣으면 전국 시도 17행이 온다(2026-08-23 재확인 — 한때 18행이었다). 시군구 다섯 자리는
    빈 배열이다. 기간 합계이며
    SPPY_TOU_NUM은 전년 같은 기간 값이다.
  columns:
    SIDO_NM: {label: 시도명, type: str, unit: ""}
    PTL_SIDO_CD: {label: 시도코드, type: str, unit: ""}
    TOU_NUM: {label: 방문자수, type: float, unit: 명}
    SPPY_TOU_NUM: {label: 전년동기_방문자수, type: float, unit: 명}

BDT_01_01_002:
  name: 시도 안 시군구별 방문자 수
  screen: /datalab/portal/bda/getMetcoAna.do
  auth: public
  params: [SGG_CD, BASE_YM1, BASE_YM2, touDivCd]
  fixed_params: {srchAreaDate: "1", tabDiv: "1", srchLocation: "1",
                 sggIntgYnFlag: "N", touDivCd: "4"}
  granularity: period
  section: 이동통신
  query_axis: 시도
  caution: >-
    **touDivCd를 보내지 않으면 오류가 아니라 빈 배열이 온다.**
    **1은 현지인이지 전체가 아니다**(2026-08-24 정정). 기본값을 4
    (외부방문자 b+c)로 바꿔 두었다. 이동통신
    체계다 — 1 전체(현지인 포함) · 2 외지인 · 3 외국인 · 4 외지인+외국인.
    2026-08-23 강원 2024년에서 2(33,233,340) + 3(350,931) =
    4(33,584,271)로 산술이 맞았다. 여기서는 1로 고정해 두었으니 현지인을
    빼려면 `--param touDivCd=4`를 쓴다.
    **시군구 다섯 자리를 넣어도 앞 두 자리만 본다.** 강릉(51150)과
    춘천(51110)이 해시까지 같은 응답을 준다 — 시군구를 고른 것이 아니라
    강원도 안의 시군구 18곳을 받은 것이다. 시도 안에서 시군구를 견줄 때
    쓴다. 전국(98)은 빈 배열이다. TOU_NUM_SQRT는 화면이 원 크기를
    정할 때 쓰는 값이라 뜻이 없다.
  columns:
    DPTR_REGN_NM: {label: 시군구명, type: str, unit: ""}
    DPTR_REGN_DTL_NM: {label: 시군구명_상세, type: str, unit: ""}
    TOU_NUM: {label: 방문자수, type: float, unit: 명}
    TOU_NUM_RATE: {label: 시도내_비중, type: float, unit: "%"}
    DTL_TOU_NUM: {label: 방문자수_상세, type: float, unit: 명}
    DTL_TOU_NUM_RATE: {label: 상세_비중, type: float, unit: "%"}
    TOU_NUM_SQRT: {label: 차트용_보조값, type: float, unit: ""}
    DTL_TOU_NUM_SQRT: {label: 차트용_보조값_상세, type: float, unit: ""}

BDT_01_01_003_4:
  name: 방문자 수 추이(월별, 구분별)
  screen: /datalab/portal/bda/getMetcoAna.do
  auth: public
  params: [SGG_CD, BASE_YM1, BASE_YM2]
  fixed_params: {srchAreaDate: "1", tabDiv: "1", srchLocation: "1",
                 sggIntgYnFlag: "N", touDivCd: "2"}
  granularity: month
  section: 이동통신
  query_axis: 시도
  caution: >-
    **touDivCd를 무시한다.** 대신 방문자 구분을 TOU_DIV_NM 컬럼으로
    나눠 한꺼번에 준다(외지인방문자·현지인방문자·외국인방문자). 다 더하면
    두 번 센다. **SGG_CD에 다섯 자리를 넣으면 무시하고 전국 시도표를
    준다** — 2026-08-23 실호출에서 강릉(51150)·종로(11110)·빈 값이
    모두 같은 행 수를 줬다(2026-08-23 재확인: 2022~2025 모두 612행 — 한때 306행이었다). 즉 이 지표는 시도 축이다. 시군구 방문자
    월별 추이는 LN_04_01_022를 쓴다. 전국(98)은 빈 배열이다.
  columns:
    BASE_DATE: {label: 기준월, type: str, unit: ""}
    SIDO_NM: {label: 지역명, type: str, unit: ""}
    TOU_DIV_NM: {label: 방문자구분, type: str, unit: ""}
    TOU_NUM: {label: 방문자수, type: float, unit: 명}
    SPPY_TOU_NUM: {label: 전년동월_방문자수, type: float, unit: 명}
    DTL_TOU_NUM_RATE: {label: 전년동월_증감률, type: float, unit: "%"}

BDT_01_01_004_3_5:
  name: 방문자 거주지 분포
  screen: /datalab/portal/bda/getMetcoAna.do
  auth: public
  params: [SGG_CD, BASE_YM1, BASE_YM2, touDivCd]
  fixed_params: {srchAreaDate: "1", tabDiv: "1", srchLocation: "1",
                 sggIntgYnFlag: "N"}
  granularity: period
  section: 이동통신
  query_axis: 지역
  caution: >-
    시도와 시군구를 모두 받으며 값이 다르다. 거주 시도와 그 안의
    시군구가 함께 오므로(DPTR_REGN_NM이 시도, DPTR_REGN_DTL_NM이
    시군구) 다 더하면 두 번 센다. 한쪽을 골라 읽어라.
  columns:
    DPTR_REGN_NM: {label: 거주_시도, type: str, unit: ""}
    DPTR_REGN_DTL_NM: {label: 거주_시군구, type: str, unit: ""}
    TOU_NUM: {label: 시도_방문자수, type: float, unit: 명}
    TOU_NUM_RATE: {label: 시도_비중, type: float, unit: "%"}
    DTL_TOU_NUM: {label: 시군구_방문자수, type: float, unit: 명}
    TOT_DTL_TOU_NUM_RATE: {label: 시군구_비중, type: float, unit: "%"}
    TOU_NUM_SQRT: {label: 차트용_보조값, type: float, unit: ""}

BDT_01_03_001:
  name: 지역별 방문자 수 추이(여러 지역 비교)
  screen: /datalab/portal/bda/getByRegnAna.do
  auth: public
  params: [SGG_CD, "arrSggCd[]", BASE_YM1, BASE_YM2]
  fixed_params: {srchAreaDate: "1", tabDiv: "1", txtSGG_CD: "1",
                 txtSIDO_ARR: "", txtADONG_ARR: "", SIDO_ARR: ""}
  granularity: month
  section: 이동통신
  query_axis: 시도
  caution: >-
    비교 화면의 지표다. **빈 문자열 파라미터까지 다 보내야 한다** —
