BDT_01_01_004_4:
  name: 시군구 방문자 수 추이(월별, 구분별)
  screen: /datalab/portal/bda/getMetcoAna.do
  auth: public
  params: [SGG_CD, BASE_YM1, BASE_YM2]
  fixed_params: {srchAreaDate: "1", tabDiv: "1", srchLocation: "1",
                 sggIntgYnFlag: "N", touDivCd: "1"}
  granularity: month
  section: 이동통신
  query_axis: 지역
  caution: >-
    **touDivCd 를 무시하고 구분을 TOU_DIV_NM 컬럼으로 나눠서 한꺼번에
    준다**(0·1·2·3·4 어느 값을 넣어도 응답이 같다, 2026-08-24 확인).
    세 갈래가 온다 — 현지인방문자(a) · 외지인방문자(b) ·
    전체방문자(a+b). **다 더하면 두 배가 된다**(전체가 나머지 둘의
    합이다). 강릉시 2024년 현지인 68,224,356 + 외지인 33,233,341 =
    101,457,697 이고 전체 행이 101,457,694 다(오차 3, 2026-08-24 검산).
    **이 저장소에서 '전체 방문자'를 부를 수 있는 유일한 자리다** —
    touDivCd 로는 부를 수 없다.
    12개월이면 36행이다. 시도나 전국(98)은 빈 배열이다.
    연인원이므로 인구와 비교하지 마라. SPPY_TOU_NUM 은 전년 같은 달 값이다.
  columns:
    BASE_DATE: {label: 기준월, type: str, unit: ""}
    SIDO_NM: {label: 지역명, type: str, unit: ""}
    SGG_CD: {label: 시군구코드, type: str, unit: ""}
    TOU_DIV_NM: {label: 방문자구분, type: str, unit: ""}
    TOU_NUM: {label: 방문자수, type: float, unit: 명}
    SPPY_TOU_NUM: {label: 전년동월_방문자수, type: float, unit: 명}
    DTL_TOU_NUM_RATE: {label: 구성비, type: float, unit: "%"}

BDT_01_01_005_1:
  name: 시군구 안 읍면동별 방문자 수
  screen: /datalab/portal/bda/getMetcoAna.do
  auth: public
  params: [SGG_CD, BASE_YM1, BASE_YM2, touDivCd]
  fixed_params: {srchAreaDate: "1", tabDiv: "1", srchLocation: "1",
                 sggIntgYnFlag: "N", touDivCd: "4"}
  granularity: period
  section: 이동통신
  query_axis: 지역
  caution: >-
    **읍면동 단위다.** 강릉시 21행이며 시도나 전국(98)은 빈 배열이다.
    touDivCd 가 먹는다 — 2 + 3 = 4 를 검산했다(외지인 66,139,157 +
    외국인 743,885 = 66,883,042, 응답 66,883,040, 2026-08-24).
    **읍면동을 다 더해도 시군구가 되지 않는다.** 강릉시 외지인이
    33,233,340명인데 읍면동 합은 66,139,157명으로 **1.99배**다 —
    읍면동 사이를 오간 사람이 동마다 한 번씩 세어지기 때문이다.
    통합시 산하 구를 더하면 안 되는 것과 같은 이유다.
    `SGG_CD` 컬럼에 **열 자리 읍면동 코드**가 온다(5115025000).
    `SIDO_NM` 에도 읍면동 이름이 들어온다 — 시도가 아니다.
    SPPY_TOU_NUM 과 DTL_TOU_NUM_RATE 는 늘 0이다(2026-08-24 확인).
  columns:
    SGG_CD: {label: 읍면동코드_열자리, type: str, unit: ""}
    PTL_SIDO_CD: {label: 포털_지역코드, type: str, unit: ""}
    AREA_NM: {label: 읍면동명, type: str, unit: ""}
    SIDO_NM: {label: 읍면동명_중복, type: str, unit: ""}
    TOU_NUM: {label: 방문자수, type: float, unit: 명}
    SPPY_TOU_NUM: {label: 전년동기_방문자수_비어있음, type: float, unit: 명}
    DTL_TOU_NUM_RATE: {label: 구성비_비어있음, type: float, unit: "%"}

