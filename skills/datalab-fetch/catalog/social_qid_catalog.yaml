# 한국관광 데이터랩 qid 카탈로그 — 해외 소셜미디어
#
# 화면: nat/getTrendTourForm (국가별 분석 > 소셜미디어 분석)
#
# 다른 카탈로그가 "누가 왔고 얼마를 썼나"를 세는 데 비해, 여기는
# **오기 전에 무엇을 이야기하는가**를 본다. 이 저장소에서 유일하게
# 방문·소비가 아닌 층이다.
#
# ── 왜 오래 못 찾았나 ───────────────────────────────────────────
# 색인이 파라미터를 `NAT_CD` 로 적고 있었는데 실제로는 **`natCd`**
# (소문자 camelCase)다. 대문자로 보내면 오류가 아니라 **빈 배열**이
# 온다 — 그래서 열 지표가 "값이 없는 화면"으로 남아 있었다.
# 2026-08-24 `discover.py capture` 로 브라우저의 실제 요청을 잡아
# 알아냈다. **화면 JS 만 읽어서는 알 수 없는 자리다**(JS 는
# `params` 객체를 통째로 넘긴다).
#
# ── **국가 코드 체계가 다르다** ─────────────────────────────────
# 이 저장소의 다른 국가 지표는 `natCd` 에 `JP`·`CN` 같은 두 글자를
# 받는다. **여기는 `392`(일본)·`840`(미국) 같은 ISO 숫자 코드다.**
# `natCd=JP` 를 보내면 오류가 아니라 빈 배열이 온다.
# `codes.resolve_country()` 가 주는 코드를 그대로 쓰면 안 된다 —
# 이름→숫자 표는 `NAT_09_01_004` 의 응답에서 얻는다(26개국).
#
# ── 탭이 둘이다 ────────────────────────────────────────────────
# `TAB_DIV=1` 글로벌 탭 · `TAB_DIV=2` 국가별 탭. `_02_*` 지표는
# 2번 탭 것이라 `natCd` 를 함께 줘야 뜻이 있다.
#
# ── 산술로 확인한 것(2026-08-24, 202508~202607) ────────────────
#   NAT_09_01_001 의 '글로벌' 행 = 나머지 26개국 BZ_VAL 합 (6,649,970)
#   NAT_09_01_004 = 001 에서 '글로벌' 행을 뺀 26개국
#   NAT_09_01_002 의 열두 달 합 = 001 의 글로벌 값
#   NAT_09_01_005 긍정 + 부정 = 100.0
#   NAT_09_01_007 다섯 플랫폼 점유율 합 = 100.0
#
# ── 세 낱말 ────────────────────────────────────────────────────
# BZ_VAL(버즈) 언급 건수 · ENGMT_VAL(인게이지먼트) 좋아요·댓글·공유
# 같은 반응 수 · POTE_EXPSR_VAL(잠재 노출량) 그 글이 닿을 수 있었던
# 사람 수의 추정. **셋은 자릿수가 다르다** — 글로벌 한 달이 각각
# 665만 · 2.2억 · 1,618억이다. 같은 축에 그리면 언급량이 사라진다.

NAT_09_01_001:
  name: 국가별 언급량·인게이지먼트·잠재노출(합산)
  screen: /datalab/portal/nat/getTrendTourForm.do
  auth: public
  params: [natCd, BASE_YM1, BASE_YM2, srchAreaDate, TAB_DIV]
  fixed_params: {natCd: "", srchAreaDate: "1", TAB_DIV: "1"}
  granularity: period
  section: 소셜미디어
  query_axis: 전국
  caution: >-
    **`'글로벌'` 행이 나머지 국가의 합이다.** 202508~202607 에서
    글로벌 6,649,970 이 나머지 26개국 `BZ_VAL` 합과 정확히 같았다
    (2026-08-24 검산). 걸러내지 않고 더하면 두 배가 된다.
    **파라미터 이름이 `natCd` 다**(소문자). 색인의 `NAT_CD` 로
    보내면 오류가 아니라 빈 배열이 온다.
    세 컬럼은 자릿수가 다르다 — 언급 665만 · 반응 2.2억 · 잠재노출
    1,618억. 같은 축에 그리면 언급량이 사라진다.
    국가 수는 기간마다 다를 수 있으니 못 박지 마라.
  columns:
    NAT_NM: {label: 국가명, type: str, unit: ""}
    BZ_VAL: {label: 언급량, type: float, unit: 건}
    ENGMT_VAL: {label: 인게이지먼트, type: float, unit: 건}
    POTE_EXPSR_VAL: {label: 잠재_노출량, type: float, unit: 회}

NAT_09_01_002:
  name: 글로벌 언급량·인게이지먼트 추이(월별)
  screen: /datalab/portal/nat/getTrendTourForm.do
  auth: public
  params: [natCd, BASE_YM1, BASE_YM2, srchAreaDate, TAB_DIV]
  fixed_params: {natCd: "", srchAreaDate: "1", TAB_DIV: "1"}
  granularity: month
  section: 소셜미디어
  query_axis: 전국
  caution: >-
    전 세계 합계의 월별 추이다. 열두 달 `BZ_VAL` 합이
    `NAT_09_01_001` 의 '글로벌' 행과 같다(2026-08-24 검산).
    **국가를 골라도 값이 바뀌지 않는다** — 국가별은 `NAT_09_02_001`
    을 쓴다. `natCd` 는 소문자다.
  columns:
    BASE_YM: {label: 기준월, type: str, unit: ""}
    BZ_VAL: {label: 언급량, type: float, unit: 건}
    ENGMT_VAL: {label: 인게이지먼트, type: float, unit: 건}

NAT_09_01_003:
  name: 글로벌 언급량·인게이지먼트 증감률(월별)
  screen: /datalab/portal/nat/getTrendTourForm.do
  auth: public
  params: [natCd, BASE_YM1, BASE_YM2, srchAreaDate, TAB_DIV]
  fixed_params: {natCd: "", srchAreaDate: "1", TAB_DIV: "1"}
  granularity: month
  section: 소셜미디어
  query_axis: 전국
  caution: >-
    **컬럼 이름이 `_002` 와 같지만 값은 증감률(%)이다.** 202508 이
    -0.01 · 8.83 처럼 작은 수로 오는 것으로 구분한다 — 건수로 읽으면
    "언급이 한 건도 없었다"가 된다. 전월 대비인지 전년 동월 대비인지
    데이터랩이 밝히지 않아 못 박지 않는다.
  columns:
    BASE_YM: {label: 기준월, type: str, unit: ""}
    BZ_VAL: {label: 언급량_증감률, type: float, unit: "%"}
    ENGMT_VAL: {label: 인게이지먼트_증감률, type: float, unit: "%"}

NAT_09_01_004:
  name: 국가별 소셜 포지셔닝(글로벌 행 없음)
  screen: /datalab/portal/nat/getTrendTourForm.do
  auth: public
  params: [natCd, BASE_YM1, BASE_YM2, srchAreaDate, TAB_DIV]
  fixed_params: {natCd: "", srchAreaDate: "1", TAB_DIV: "1"}
  granularity: period
  section: 소셜미디어
  query_axis: 전국
  caution: >-
    `NAT_09_01_001` 에서 **'글로벌' 행만 뺀 것**이다(26개국, 값 동일,
    2026-08-24 검산). 합계 행이 섞이면 안 되는 자리에서는 이쪽을
    쓴다. `NAT_CD` 컬럼이 함께 오는 것이 001 과의 차이다.
  columns:
    NAT_CD: {label: 국가코드, type: str, unit: ""}
    NAT_NM: {label: 국가명, type: str, unit: ""}
    BZ_VAL: {label: 언급량, type: float, unit: 건}
    ENGMT_VAL: {label: 인게이지먼트, type: float, unit: 건}
    POTE_EXPSR_VAL: {label: 잠재_노출량, type: float, unit: 회}

NAT_09_01_005:
  name: 글로벌 긍부정 점유율 추이(월별)
  screen: /datalab/portal/nat/getTrendTourForm.do
  auth: public
  params: [natCd, BASE_YM1, BASE_YM2, srchAreaDate, TAB_DIV]
  fixed_params: {natCd: "", srchAreaDate: "1", TAB_DIV: "1"}
  granularity: month
  section: 소셜미디어
  query_axis: 전국
  caution: >-
    긍정 + 부정 = 100.0 이다(2026-08-24 검산). **'보통'이 없다** —
    숙박 리뷰 감성(`NAT_11_03_008`)은 셋으로 나누므로 두 지표의
    긍정률을 나란히 놓으면 안 된다. 소수점이 길게 온다(76.66841…).
    `NAT_CD` 가 `"_"` 로 오고 `NAT_NM` 이 '글로벌'이다.
  columns:
    NAT_CD: {label: 국가코드, type: str, unit: ""}
    BASE_YM: {label: 기준월, type: str, unit: ""}
    NAT_NM: {label: 국가명, type: str, unit: ""}
    POSTV_IDCT_RAT: {label: 긍정_비율, type: float, unit: "%"}
    INSTC_IDCT_RAT: {label: 부정_비율, type: float, unit: "%"}

NAT_09_01_006:
  name: 국가별 월별 해시태그 Top10
  screen: /datalab/portal/nat/getTrendTourForm.do
  auth: public
  params: [natCd, BASE_YM1, BASE_YM2, srchAreaDate, TAB_DIV]
  fixed_params: {natCd: "392", srchAreaDate: "1", TAB_DIV: "2"}
  granularity: month
  section: 소셜미디어
  query_axis: 전국
  caution: >-
    **`natCd` 를 반드시 줘야 한다**(기본 392 일본). 빈 값이면 빈
    배열이다. 국가 × 달 × 10위라 행이 많다 — 일본 열두 달이 120행
    이다(2026-08-24 확인). 해시태그는 **그 나라 말 그대로** 온다
    (`#韓国美容`). 번역해 옮기면 원문을 잃는다.
  columns:
    NAT_CD: {label: 국가코드, type: str, unit: ""}
    BASE_YM: {label: 기준월, type: str, unit: ""}
    HSTG_RK: {label: 순위, type: float, unit: ""}
    HSTG_NM: {label: 해시태그, type: str, unit: ""}

NAT_09_01_007:
  name: 국가별 소셜미디어 플랫폼 점유율(월별)
  screen: /datalab/portal/nat/getTrendTourForm.do
  auth: public
  params: [natCd, BASE_YM1, BASE_YM2, srchAreaDate, TAB_DIV]
  fixed_params: {natCd: "392", srchAreaDate: "1", TAB_DIV: "2"}
  granularity: month
  section: 소셜미디어
  query_axis: 전국
  caution: >-
    다섯 점유율 합이 100.0 이다(2026-08-24 검산). **페이스북이
    0에 가깝게 온다** — 일본 202508 이 4.27e-06 이다. 0으로
    반올림해 "페이스북이 없다"고 적지 말고 소수점을 밝힌다.
    `natCd` 를 줘야 한다(기본 392 일본).
  columns:
    NAT_CD: {label: 국가코드, type: str, unit: ""}
    BASE_YM: {label: 기준월, type: str, unit: ""}
    NAT_NM: {label: 국가명, type: str, unit: ""}
    TWTT_PORS_RAT: {label: 트위터_점유율, type: float, unit: "%"}
    FCBK_PORS_RAT: {label: 페이스북_점유율, type: float, unit: "%"}
    INSTA_PORS_RAT: {label: 인스타그램_점유율, type: float, unit: "%"}
    YTBE_PORS_RAT: {label: 유튜브_점유율, type: float, unit: "%"}
    ETC_PORS_RAT: {label: 기타_점유율, type: float, unit: "%"}

NAT_09_02_001:
  name: 한 국가의 언급량·인게이지먼트 추이(월별)
  screen: /datalab/portal/nat/getTrendTourForm.do
  auth: public
  params: [natCd, BASE_YM1, BASE_YM2, srchAreaDate, TAB_DIV]
  fixed_params: {natCd: "392", srchAreaDate: "1", TAB_DIV: "2"}
  granularity: month
  section: 소셜미디어
  query_axis: 전국
  caution: >-
    **`_SUM` 두 컬럼은 기간 전체의 합이라 모든 행에 같은 값이
    반복된다.** 월별 값은 `BZ_VAL`·`ENGMT_VAL` 이다 — `_SUM` 을
    더하면 열두 배가 된다. `natCd` 를 줘야 한다(기본 392 일본).
  columns:
    BASE_YM: {label: 기준월, type: str, unit: ""}
    BZ_VAL: {label: 언급량, type: float, unit: 건}
    ENGMT_VAL: {label: 인게이지먼트, type: float, unit: 건}
    BZ_VAR_SUM: {label: 기간합_언급량, type: float, unit: 건}
    ENGMT_VAL_SUM: {label: 기간합_인게이지먼트, type: float, unit: 건}

NAT_09_02_002:
  name: 한 국가의 언급량·인게이지먼트 증감률(월별)
  screen: /datalab/portal/nat/getTrendTourForm.do
  auth: public
  params: [natCd, BASE_YM1, BASE_YM2, srchAreaDate, TAB_DIV]
  fixed_params: {natCd: "392", srchAreaDate: "1", TAB_DIV: "2"}
  granularity: month
  section: 소셜미디어
  query_axis: 전국
  caution: >-
    **`_002` 와 컬럼 이름이 같지만 값은 증감률(%)이다**
    (`NAT_09_02_001` 과 짝). 26.33 · -10.19 처럼 작은 수로 오는
    것으로 구분한다. `_SUM` 은 기간 전체 증감률이라 행마다 반복된다.
  columns:
    BASE_YM: {label: 기준월, type: str, unit: ""}
    BZ_VAL: {label: 언급량_증감률, type: float, unit: "%"}
    ENGMT_VAL: {label: 인게이지먼트_증감률, type: float, unit: "%"}
    BZ_VAR_SUM: {label: 기간_언급량_증감률, type: float, unit: "%"}
    ENGMT_VAL_SUM: {label: 기간_인게이지먼트_증감률, type: float, unit: "%"}

NAT_09_02_003:
  name: 한 국가의 긍부정 점유율 추이(월별)
  screen: /datalab/portal/nat/getTrendTourForm.do
  auth: public
  params: [natCd, BASE_YM1, BASE_YM2, srchAreaDate, TAB_DIV]
  fixed_params: {natCd: "392", srchAreaDate: "1", TAB_DIV: "2"}
  granularity: month
  section: 소셜미디어
  query_axis: 전국
  caution: >-
    긍정 + 부정 = 100 이고 '보통'이 없다(글로벌판 `NAT_09_01_005`
    와 같다). **`_SUM` 두 컬럼은 열두 달 비율을 그냥 더한 값이라
    922.2 처럼 온다** — 평균이 아니다. 평균이 필요하면 달 수로
    나눈다. `natCd` 를 줘야 한다(기본 392 일본).
  columns:
    NAT_CD: {label: 국가코드, type: str, unit: ""}
    BASE_YM: {label: 기준월, type: str, unit: ""}
    NAT_NM: {label: 국가명, type: str, unit: ""}
    POSTV_IDCT_RAT: {label: 긍정_비율, type: float, unit: "%"}
    INSTC_IDCT_RAT: {label: 부정_비율, type: float, unit: "%"}
    POSTV_IDCT_RAT_SUM: {label: 기간_긍정비율_합, type: float, unit: "%"}
    INSTC_IDCT_RAT_SUM: {label: 기간_부정비율_합, type: float, unit: "%"}
