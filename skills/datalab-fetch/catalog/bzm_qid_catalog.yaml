# ── 2026-08-24 추가 — 관광숙박업 전국 현황 (BZM_07_01_*) ────────
#
# **한때 "넣지 않는다"고 적어 둔 자리다.** 그때 이유는 "전국 합이
# 1,291,982실로 BZM_03_01_001(879,593실)과 47% 어긋나는데 기준 시점
# 컬럼이 없어 가릴 수 없다"였다. **그 이유가 틀렸다.**
#
# 진짜 원인은 `srchGrdTyp` 를 몰라서였다. 이 파라미터가 **사업체 수와
# 객실 수를 가른다**:
#
#   srchGrdTyp=VEND_NUM → 2024년 전국 2,731 개소
#   srchGrdTyp=RM_NUM   → 2024년 전국 220,414 실
#
# **같은 qid 가 컬럼 이름까지 바꿔서 준다** — `VEND_NUM` 또는
# `RM_NUM` 이다. 안 보내면 두 체계가 뒤섞인 값이 오고, 그것을
# 객실 수로 읽었던 것이다. `discover.py capture` 로 브라우저 요청을
# 잡아 알아냈다(2026-08-24).
#
# **`BZM_03_01_001`(879,593실)과 다른 것은 정상이다.** 이쪽은
# 관광진흥법상 **관광숙박업**(호텔·콘도)만이고 저쪽은 모텔·민박을
# 포함한 전체 숙박업이다. 두 숫자를 같은 표에 놓지 마라.
#
# 카탈로그에는 `srchGrdTyp: RM_NUM`(객실 수)을 기본으로 박았다.
# 사업체 수가 필요하면 `--param srchGrdTyp=VEND_NUM` 으로 바꾼다 —
# **그때는 컬럼 이름도 `VEND_NUM` 으로 바뀐다.**

BZM_07_01_001:
  name: 시도별 관광숙박업 객실 수(연간)
  screen: /datalab/portal/bzm/getBzmanTourismLodgForm.do
  auth: public
  params: [SGG_CD, BASE_YM1, BASE_YM2, srchGrdTyp]
  fixed_params: {SGG_CD: "", srchGrdTyp: "RM_NUM"}
  granularity: year
  section: 공급
  query_axis: 전국
  caution: >-
    **`srchGrdTyp` 가 무엇을 세는지 가른다** — `RM_NUM`(객실 수,
    2024년 전국 220,414실) 또는 `VEND_NUM`(사업체 수, 2,731개소).
    바꾸면 **응답 컬럼 이름도 함께 바뀐다.**
    **16행짜리 시도표다** — 광주와 전남이 '전남광주통합특별시' 한
    행으로 온다(2026-08-24 확인). 17행짜리 시도표와 이름으로 이어
    붙이면 광주와 전남이 조용히 사라진다.
    **관광숙박업(호텔·콘도)만이다.** 모텔·민박을 포함한
    `BZM_03_01_001`(879,593실)과 다른 것이 정상이다.
    조회 지역과 무관하게 전국이 온다.
  columns:
    SIDO_CD: {label: 시도코드, type: str, unit: ""}
    PTL_SIDO_CD: {label: 포털_시도코드, type: str, unit: ""}
    SIDO_NM: {label: 시도명, type: str, unit: ""}
    PTL_SIDO_NM: {label: 포털_시도명, type: str, unit: ""}
    RM_NUM: {label: 객실수, type: float, unit: 실}
    VEND_NUM: {label: 사업체수, type: float, unit: 개소}

BZM_07_01_002:
  name: 시도별 관광숙박업 객실 수 비율(연간)
  screen: /datalab/portal/bzm/getBzmanTourismLodgForm.do
  auth: public
  params: [SGG_CD, BASE_YM1, BASE_YM2, srchGrdTyp]
  fixed_params: {SGG_CD: "", srchGrdTyp: "RM_NUM"}
  granularity: year
  section: 공급
  query_axis: 전국
  caution: >-
    `BZM_07_01_001` 과 같은 값에 비율을 붙인 것이다. **비율 합이
    101~102% 로 온다**(소수 첫째 자리 반올림, 2026-08-24 확인) —
    100 이 아니라고 오류로 보지 마라. 여기도 **16행짜리 시도표**다
    ('전남광주통합특별시'). `srchGrdTyp` 로 객실/사업체가 갈리고
    컬럼 이름도 함께 바뀐다.
  columns:
    SIDO_CD: {label: 시도코드, type: str, unit: ""}
    SIDO_NM: {label: 시도명, type: str, unit: ""}
    RM_NUM: {label: 객실수, type: float, unit: 실}
    RM_NUM_PER: {label: 객실수_비중, type: float, unit: "%"}
    VEND_NUM: {label: 사업체수, type: float, unit: 개소}
    VEND_NUM_PER: {label: 사업체수_비중, type: float, unit: "%"}

BZM_07_01_003:
  name: 업종별 관광숙박업 객실 수(연도별)
  screen: /datalab/portal/bzm/getBzmanTourismLodgForm.do
  auth: public
  params: [SGG_CD, BASE_YM1, BASE_YM2, srchGrdTyp]
  fixed_params: {SGG_CD: "", srchGrdTyp: "RM_NUM"}
  granularity: year
  section: 공급
  query_axis: 전국
  caution: >-
    **`TOB_NM='합계'` 행이 섞여 있다.** 걸러내지 않고 더하면 두 배가
    된다 — 2024년 행을 다 더하면 440,828 인데 실제는 220,414 다
    (2026-08-24 검산).
    **기간 파라미터를 무시하고 여러 해를 한꺼번에 준다**(2019~2024,
    54행). 응답의 `BASE_YEAR` 로 걸러라.
    업종 여덟에 합계 하나다 — 관광호텔업·가족호텔업·소형호텔업·
    수상관광호텔업·의료관광호텔업·전통호텔업·호스텔업·휴양콘도미니엄업.
    `srchGrdTyp` 로 객실/사업체가 갈리고 컬럼 이름도 바뀐다.
  columns:
    BASE_YEAR: {label: 기준연도, type: str, unit: ""}
    TOB_NM: {label: 업종, type: str, unit: ""}
    RM_NUM: {label: 객실수, type: float, unit: 실}
    VEND_NUM: {label: 사업체수, type: float, unit: 개소}

BZM_07_01_004:
  name: 전국 관광숙박업 객실 수 추이(연간)
  screen: /datalab/portal/bzm/getBzmanTourismLodgForm.do
  auth: public
  params: [SGG_CD, BASE_YM1, BASE_YM2, srchGrdTyp]
  fixed_params: {SGG_CD: "", srchGrdTyp: "RM_NUM"}
  granularity: year
  section: 공급
  query_axis: 전국
  caution: >-
    전국 한 줄짜리 추이다. 2019년 178,690실 → 2024년 220,414실
    (사업체는 2,218 → 2,731개소, 2026-08-24 확인).
    **기간 파라미터를 무시하고 여섯 해를 준다.**
    `BZM_07_01_001` 의 시도 합과 같은 해 값이 맞는다.
    `srchGrdTyp` 로 객실/사업체가 갈리고 컬럼 이름도 바뀐다.
  columns:
    BASE_YEAR: {label: 기준연도, type: str, unit: ""}
    RM_NUM: {label: 객실수, type: float, unit: 실}
    VEND_NUM: {label: 사업체수, type: float, unit: 개소}
