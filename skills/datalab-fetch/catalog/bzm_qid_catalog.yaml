# 한국관광 데이터랩 qid 카탈로그 — 관광사업체(공급) 영역
#
# 지역 카탈로그(loc_qid_catalog.yaml)와 같은 SGG_CD 축을 쓰지만 파라미터
# 모양이 다르다. dispYn·tabDiv를 쓰지 않고 BASE_YM2 하나로 시점을 정한다.
# 그래서 카탈로그를 나눴다.
#
# **이 계열은 저량(stock)이다.** 방문자 수 같은 유량(flow)과 나눌 때는
# 기준 시점을 반드시 표기하라. "2026년 7월 시점 객실 520개"와
# "2024년 한 해 숙박 방문자 수"를 아무 말 없이 나누면 안 된다.
#
# ── 이름을 믿지 마라 ──────────────────────────────────────────
# 사이트 JS의 dnname이 실제 의미와 **뒤바뀌어** 있다.
#   BZM_03_01_001_01  dnname "숙박시설 현황"  → 화면은 "총 숙박객실 수"
#   BZM_03_02_001_01  dnname "숙박객실 현황"  → 화면은 "총 숙박시설 수"
# 강릉시 2026-07 기준 각각 14,283과 520이다. 이름대로 읽었으면 객실과
# 업체를 27배 뒤바꿨을 것이다. 아래 라벨은 화면 렌더링 문구를 따랐다.
# ──────────────────────────────────────────────────────────────
#
# 조회 가능 기간: 201701~202607 (getSrchDteDivInitVal.do 확인)
# BZM_02_02_001_01(개폐업 총계)은 HTTP 200에 0바이트를 돌려준다. 뺐다.

