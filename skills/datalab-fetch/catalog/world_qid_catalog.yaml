# 한국관광 데이터랩 qid 카탈로그 — 세계관광통계
#
# 다른 카탈로그가 한국 안이나 방한객을 다루는 데 비해, 여기는 **세계
# 82개국의 관광 규모**를 다룬다. 우리나라가 세계에서 어디쯤인지 물을 때
# 쓰는 유일한 지표다.
#
# ── 엔드포인트가 다르다 ─────────────────────────────────────────
# 데이터랩에는 데이터 API가 둘 있다. 다른 카탈로그는 모두
# /visualize/getTempleteData.do 를 쓰지만, 이 화면은 피벗 그리드로
# 그려서 /visualize/getGridData.do 를 쓴다.
#
#   client.fetch(qid, params, endpoint=client.GRID_ENDPOINT)
#
# 엔드포인트를 빼면 오류가 아니라 **빈 배열**이 온다. 카탈로그 항목의
# endpoint 필드가 그것을 못 박는다.
# ────────────────────────────────────────────────────────────────

TS_01_08_001:
  name: 세계 국가별 관광 규모와 순위(연도별)
  screen: /datalab/portal/ts/getWldTursmStatsForm.do
  auth: public
  endpoint: grid
  params: [BASE_YM1, BASE_YM2]
  fixed_params: {}
  granularity: year
  section: 세계
  query_axis: 전국
  caution: >-
    **/visualize/getGridData.do 로 불러야 한다**(endpoint: grid).
    보통 엔드포인트로 부르면 빈 배열이 온다. 기간은 연도 네 자리다.
    국가를 고를 수 없다 — 한 해가 통째로 온다.
    **국가명이 "전체"인 합계 행이 구분마다 하나씩 섞여 있고, 그 행의
    NAT_RK는 순위가 아니라 0(인바운드) 또는 999(관광수입·관광지출)다.**
    순위로 정렬하면 그 행이 1위로 올라오고, 999를 "999위"로 싣게 된다.
    빼고 읽어라 — 실제 국가는 1~50위 오십 곳이며 대한민국은 그 안에
    없다(2022 기준). **2023년부터는 국가별이 오지 않고 "전체" 두 행만
    온다**(2026-08-23 확인: 2019년 203행 · 2022년 153행 · 2023년 2행 ·
    2024년 2행). 국가별 순위를 보려면 2022년까지를 물어라. DIV_NM으로 네 갈래가
    섞여 있으므로(인바운드·아웃바운드·관광수입·관광지출) 다 더하면
    뜻이 없는 숫자가 된다. NAT_RK는 그 해 그 구분 안에서의 순위이고
    문자열로 온다. DIV_NM_VAL의 단위를 사이트가 표기하지 않는다 —
    인원과 금액이 같은 컬럼에 섞여 있으므로 절대값을 단정하지 말고
    국가 간 비교와 순위로 읽어라.
  columns:
    NAT_NM: {label: 국가명, type: str, unit: ""}
    DIV_NM: {label: 구분, type: str, unit: ""}
    BASE_DATE: {label: 기준연도, type: str, unit: ""}
    DIV_NM_VAL: {label: 값, type: float, unit: ""}
    NAT_RK: {label: 순위, type: str, unit: ""}

# ── 2026-08-24 추가 — 세계 전체 한 줄 ──────────────────────────
# 위의 `TS_01_08_001` 이 나라별로 쪼개 준다면, 아래 둘은 **세계를
# 한 숫자로** 준다. 화면이 다르다(nat/natReport, 관광시장동향).
#
# **이름이 가장 크게 거짓말하는 자리다.** `NAT_02_01_001` 의 컬럼
# 이름은 `KOR_VST_TOU_NUM`("방한 관광객수")인데 2018년 값이
# 1,413,000 이다. 방한객은 그 해 1,534만명이었으니 단위를 어떻게
# 맞춰도 방한 통계가 아니다. 차트 코드가 답을 준다 —
#   barSeriesPivot4MainOsea(..., '천명', ...)  → 14.13억명
# 2018년 세계 국제관광객 도착수가 14.07억명이다. 관광수입도 같다:
# 1,431,000 백만달러 = 1.43조 달러(그 해 세계 관광수입).
#
# **기간·국가 파라미터를 둘 다 무시한다.** 화면 JS 가 직접 적어
# 놓았다 — "쿼리에 2017~2021 로 하드코딩 되어 있으므로, 매개변수
# NULL 처리". 실제로 `NAT_CD` 에 일본(112)을 넣든 미국(111)을 넣든
# 같은 여덟 행이 온다.
#
# ── 넣지 않은 것 ───────────────────────────────────────────────
# `NAT_02_01_002`(세계 아웃바운드 여행객) — 어떤 파라미터로도 빈
#   배열이라 값의 뜻을 확인할 길이 없다.
# `NAT_02_01_003`(세계 관광지출) — 2017·2018 두 해뿐인 데다 2018년
#   `VAL3` 가 1,431,000 으로 `_004` 의 관광수입과 한 자리도 틀리지
#   않고 같다. 세계 수입과 지출이 근사하긴 하나 완전히 일치할 이유는
#   없어, 같은 계열을 다른 이름으로 주는 것인지 가릴 수 없었다.
# `NAT_02_01_005` — 지표가 아니라 관광시장동향 **PDF 자료실 목록**
#   이다(제목·등록일·파일명). 숫자가 없다.

NAT_02_01_001:
  name: 세계 국제관광객 도착수(연간)
  screen: /datalab/portal/nat/natReport.do
  auth: public
  params: [ALL_YN, BASE_YM1, BASE_YM2, NAT_CD]
  fixed_params: {ALL_YN: "Y"}
  granularity: year
  section: 세계
  query_axis: 전국
  caution: >-
    **컬럼 이름 `KOR_VST_TOU_NUM` 은 "방한"처럼 보이지만 세계 전체다.**
    단위는 천명이고 2018년 1,413,000(=14.13억명)이 UN Tourism 의 세계
    국제관광객 도착수와 맞는다(2026-08-24 확인). 방한객 통계로 옮겨
    적으면 90배 넘게 부푼다 — 방한객은 `entry_qid_catalog` 를 쓴다.
    **`NAT_CD` 와 `BASE_YM1/2` 를 무시한다** — 국가를 바꿔도 기간을
    바꿔도 같은 여덟 행(2018~2025)이 온다.
  columns:
    BASE_DATE: {label: 기준연도, type: str, unit: ""}
    KOR_VST_TOU_NUM: {label: 세계_국제관광객수, type: float, unit: 천명}

NAT_02_01_004:
  name: 세계 관광수입(연간)
  screen: /datalab/portal/nat/natReport.do
  auth: public
  params: [ALL_YN, BASE_YM1, BASE_YM2, NAT_CD]
  fixed_params: {ALL_YN: "Y"}
  granularity: year
  section: 세계
  query_axis: 전국
  caution: >-
    **한국의 관광수입이 아니라 세계 전체다.** 단위는 백만달러이고
    2018년 1,431,000(=1.43조 달러)이 그 해 세계 관광수입과 맞는다
    (2026-08-24 확인). 한국 관광수입·수지는 `outbound_qid_catalog`
    의 `NAT_05_01_004`·`NAT_08_01_008` 에 있다 — 자릿수가 세 자리
    다르므로 섞으면 바로 드러나지 않고 그럴듯하게 틀린다.
    **`NAT_CD` 와 `BASE_YM1/2` 를 무시한다**(2018~2025 여덟 행 고정).
  columns:
    BASE_DATE: {label: 기준연도, type: str, unit: ""}
    VAL2: {label: 세계_관광수입, type: float, unit: 백만달러}
