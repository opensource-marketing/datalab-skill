# 한국관광 데이터랩 qid 카탈로그 — 국가별 연간보고서
#
# 화면: nat/getYearReportForm (국가별 분석 > 국가별 연간보고서)
#
# **한 나라를 고르고 그 나라 쪽에서 본다.** 다른 국가 카탈로그가
# "그 나라에서 몇 명이 왔나"를 세는 데 비해, 여기는 "그 나라 사람이
# 어디로 가는가, 그중 한국은 몇 번째인가"를 본다.
#
# ── 국가 코드가 두 글자다 ───────────────────────────────────────
# 같은 `natCd` 인데 **소셜미디어 화면(`social_qid_catalog`)은 숫자
# 코드**(392)이고 여기는 `JP`·`TW` 두 글자다. 이 저장소에서 국가
# 코드 체계가 갈리는 두 번째 자리다. `codes.resolve_country()` 가
# 주는 코드가 여기서는 맞는다.
#
# ── 기간 파라미터를 무시한다 ────────────────────────────────────
# `BASE_YM1/2` 를 2018~2025 로 줘도 지표마다 자기 창을 준다 —
# `NAT_02_01_006` 은 2014~2021, `_07_01_020` 은 2022~ 다.
# 응답의 `BASE_YEAR` 를 보고 실제 창을 말해야 한다.
#
# ── `dnname` 은 값에 영향이 없다 ────────────────────────────────
# 브라우저는 '해외여행 지출금액' 같은 문자열을 함께 보내지만
# 값이 바뀌지 않는다(2026-08-24 확인, 세 값 모두 같은 응답).
# CSV 내려받기 파일명을 정하는 자리다.

NAT_04_01_001:
  name: 그 나라의 해외여행자 수와 방한객 수(연간)
  screen: /datalab/portal/nat/getYearReportForm.do
  auth: public
  params: [natCd, BASE_YM1, BASE_YM2]
  fixed_params: {natCd: "JP"}
  granularity: year
  section: 국가별 연간
  query_axis: 국가
  caution: >-
    두 컬럼의 크기가 다르다 — 일본 2018년은 해외여행자 18,954,000명
    중 방한 2,948,527명이다(2026-08-24 확인). **`KOR_VST_TOU_NUM`
    이 0 인 해가 있다**(2017). 값이 0 이 아니라 아직 채워지지
    않은 것으로 보이므로 "그 해 방한객이 없었다"로 읽지 마라.
    단위는 명이고 해외여행자 쪽은 천 단위로 떨어진다(추정치로 보인다).
    **기간 파라미터를 무시한다** — 응답의 `BASE_DATE` 를 봐라.
  columns:
    BASE_DATE: {label: 기준연도, type: str, unit: ""}
    OSEA_VST_TOU_NUM: {label: 해외여행자수, type: float, unit: 명}
    KOR_VST_TOU_NUM: {label: 방한객수, type: float, unit: 명}

NAT_04_01_003:
  name: 그 나라의 해외여행 지출금액(연간)
  screen: /datalab/portal/nat/getYearReportForm.do
  auth: public
  params: [natCd, BASE_YM1, BASE_YM2]
  fixed_params: {natCd: "JP"}
  granularity: year
  section: 국가별 연간
  query_axis: 국가
  caution: >-
    일본 2018년이 20,200 이다. 단위를 데이터랩이 밝히지 않아 못
    박지 않는다 — 백만달러로 보면 202억 달러로 그럴듯하지만
    **확인하지 못했으므로 절대액을 다른 지표와 견주지 마라.**
    추이와 배수로 쓴다. **기간 파라미터를 무시한다**(2018~2022).
    `dnname` 은 값에 영향이 없다.
  columns:
    BASE_YEAR: {label: 기준연도, type: str, unit: ""}
    TURSM_EXPN_AMT: {label: 해외여행_지출금액, type: float, unit: ""}

NAT_02_01_006:
  name: 그 나라 사람들의 여행 목적지 순위(연간)
  screen: /datalab/portal/nat/getYearReportForm.do
  auth: public
  params: [natCd, BASE_YM1, BASE_YM2, natNm]
  fixed_params: {natCd: "JP", natNm: "일본"}
  granularity: year
  section: 국가별 연간
  query_axis: 국가
  caution: >-
    **`RK=0` 은 1위가 아니라 '한국' 행이라는 표시다.** 한국을 맨
    앞에 고정해 놓은 자리이고 실제 순위는 `RK=1` 부터다 — 일본
    2014년은 한국 `RK=0`(2,280,434)인데 미국이 `RK=1`(3,653,454)로
    더 크다(2026-08-24 검산). **순위로 읽으면 한국이 늘 1위가 된다.**
    해마다 열 행(한국 + 상위 9개국)이고 **기간 파라미터를 무시한다**
    (일본은 2014~2021). `natNm` 을 함께 줘야 한다.
  columns:
    BASE_YEAR: {label: 기준연도, type: str, unit: ""}
    NAT_NM: {label: 출발_국가, type: str, unit: ""}
    TOUR_NAT_NM: {label: 목적지_국가, type: str, unit: ""}
    PTL_NAT_CD: {label: 목적지_국가코드, type: str, unit: ""}
    DSTN_CNT: {label: 방문자수, type: float, unit: 명}
    RK: {label: 순위_한국은0, type: float, unit: ""}

NAT_07_01_020:
  name: 방한 정보를 얻는 플랫폼 순위(연간)
  screen: /datalab/portal/nat/getYearReportForm.do
  auth: public
  params: [natCd, BASE_YM1, BASE_YM2, natNm]
  fixed_params: {natCd: "JP", natNm: "일본"}
  granularity: year
  section: 국가별 연간
  query_axis: 국가
  caution: >-
    **값이 숫자가 아니라 문자열이다** — `SRCH` 가 "YouTube(28%)"
    꼴로 온다(일본 2022년, 2026-08-24 확인). 비율을 쓰려면 괄호 안을 직접 뽑아야 한다.
    1순위 기준 조사이고 해마다 열 줄이다(일본 2022~2023).
    `RK`("1위")와 `RANK`("1")가 같은 것을 두 모양으로 준다.
    **기간 파라미터를 무시한다.** `natNm` 을 함께 줘야 한다.
  columns:
    BASE_YEAR: {label: 기준연도, type: str, unit: ""}
    RK: {label: 순위_표기, type: str, unit: ""}
    RANK: {label: 순위, type: str, unit: ""}
    SRCH: {label: 플랫폼_비율, type: str, unit: ""}

NAT_07_01_022:
  name: 방한 상품을 사는 온라인 사이트 순위(연간)
  screen: /datalab/portal/nat/getYearReportForm.do
  auth: public
  params: [natCd, BASE_YM1, BASE_YM2, natNm]
  fixed_params: {natCd: "JP", natNm: "일본"}
  granularity: year
  section: 국가별 연간
  query_axis: 국가
  caution: >-
    `NAT_07_01_020`(정보 획득)과 **다른 질문이다** — 이쪽은 구매다.
    값은 문자열이고 "Rakuten travel(14.7%)" 꼴이다. 나라마다 전혀
    다른 사이트가 나오므로 번역하거나 묶지 마라.
    **기간 파라미터를 무시한다.** `natNm` 을 함께 줘야 한다.
  columns:
    BASE_YEAR: {label: 기준연도, type: str, unit: ""}
    RK: {label: 순위_표기, type: str, unit: ""}
    RANK: {label: 순위, type: str, unit: ""}
    SRCH1: {label: 사이트_비율, type: str, unit: ""}

NAT_08_01_023:
  name: 그 나라의 해외여행 경험·의향(연간)
  screen: /datalab/portal/nat/getYearReportForm.do
  auth: public
  params: [natCd, BASE_YM1, BASE_YM2, natNm]
  fixed_params: {natCd: "JP", natNm: "일본"}
  granularity: year
  section: 국가별 연간
  query_axis: 국가
  caution: >-
    값이 "71.5%" 처럼 **퍼센트 기호가 붙은 문자열**이다. 숫자로
    쓰려면 기호를 떼야 한다. `SUR_DIV1` 과 `SUR_DIV` 가 같은 값을
    두 번 주고 `EXE_SRCH1`·`EXE_SRCH2` 도 그렇다 — 화면이 두 열로
    그리려고 복제한 자리로 보인다.
    **기간 파라미터를 무시한다.** `natNm` 을 함께 줘야 한다.
  columns:
    BASE_YEAR: {label: 기준연도, type: str, unit: ""}
    SUR_DIV1: {label: 조사항목, type: str, unit: ""}
    SUR_DIV: {label: 조사항목_사본, type: str, unit: ""}
    EXE_SRCH1: {label: 비율, type: str, unit: ""}
    EXE_SRCH2: {label: 비율_사본, type: str, unit: ""}
