# 한국관광 데이터랩 qid 카탈로그 — 관광지(POI) 영역
#
# `{SKILLS_DIR}` = 이 스킬들이 설치된 디렉토리(이 스킬 폴더의 부모). 소스
# 저장소와 배포본에서 실제 설치 위치가 다르므로, 아래 명령을 그대로 쓰기
# 전에 이 값을 자신의 설치 경로로 바꿔라.
#
# 각 항목의 query_axis 필드가 조회 축을 못 박는다. 인바운드 카탈로그의
# axis는 스코어링 축 **목록**이라 뜻이 다르다 — 섞지 마라.
#
# 조회 축이 `CONT_ID`다. 시군구도 국가도 아니고 **관광지 하나**를 가리킨다.
# CONT_ID는 고정 표가 없다. LN_05_01_011로 지역을 좁혀 찾아야 한다.
#   python3 {SKILLS_DIR}/datalab-fetch/scripts/poi.py 경포 --region 강릉시
#
# ── 이름에 속지 마라 ────────────────────────────────────────────
# LN_05_01_002의 dnname은 "방문자 추이 예측"이고 컬럼도 TOU_NUM이지만,
# 차트 축은 `집중률(%)`이다. 강릉경포해수욕장 값 94.02는 94명이 아니라
# 94.02%다. 지역 단위의 LN_04_01_011과 똑같은 함정이다.
# 근거: local_tour_chart_beta.js
#   chart3 = lineSeriesPivotTour(chartId, ..., '집중률(%)', '%');
# ────────────────────────────────────────────────────────────────
#
# LN_05_01_007은 화면 JS에서 주석 처리되어 있다("미사용로직인데 동작해서
# 주석처리"라고 적혀 있다). 서버는 정상 응답한다(강릉경포해수욕장 100행).
# 사이트가 더 이상 그리지 않는 지표이므로 값이 갑자기 끊길 수 있다.
#
# *_SQRT 컬럼은 앞 컬럼의 제곱근이다(차트 버블 크기용). 리포트에 쓰지 않는다.

LN_05_01_011:
  # 이 qid만 CONT_ID가 아니라 지역·이름으로 조회한다. 나머지 POI 지표의
  # 입구다. recordCountPerPage를 키우면 한 번에 더 받는다.
  name: 관광지 목록(지역·이름·분류로 검색)
  screen: /datalab/portal/loc/getTourDataFormBeta.do
  auth: public
  params: [SIDO_CD, SGG_CD, CONT_NM, KTO_CATE_LCLS_CD, KTO_CATE_MCLS_CD,
           BASE_YM1, BASE_YM2, firstIndex, pageIndex, recordCountPerPage,
           orderSelect, orderValue, contentList, noTheme]
  fixed_params: {firstIndex: "0", pageIndex: "1", recordCountPerPage: "500",
                 orderSelect: "", orderValue: "asc", contentList: "전체",
                 noTheme: "", CONT_NM: "", KTO_CATE_LCLS_CD: "",
                 KTO_CATE_MCLS_CD: ""}
  granularity: snapshot
  section: 목록
  query_axis: 지역
  caution: 이 지표만 CONT_ID를 쓰지 않는다. SGG_CD(시군구 5자리)로 조회한다.
  columns:
    CONT_ID: {label: 관광지ID, type: str, unit: ""}
    CONT_NM: {label: 관광지명, type: str, unit: ""}
    SIDO_CD: {label: 시도코드, type: str, unit: ""}
    SIDO_NM: {label: 시도명, type: str, unit: ""}
    SGG_CD: {label: 시군구코드, type: str, unit: ""}
    SGG_NM: {label: 시군구명, type: str, unit: ""}
    KTO_CATE_LCLS_CD: {label: 대분류코드, type: str, unit: ""}
    KTO_CATE_LCLS_NM: {label: 대분류, type: str, unit: ""}
    KTO_CATE_MCLS_CD: {label: 중분류코드, type: str, unit: ""}
    KTO_CATE_MCLS_NM: {label: 중분류, type: str, unit: ""}
    KTO_CATE_SCLS_CD: {label: 소분류코드, type: str, unit: ""}
    KTO_CATE_SCLS_NM: {label: 소분류, type: str, unit: ""}
    # 아래 일곱은 2026-08-23에 카탈로그로 옮겼다. 그전에는 원본 영문명
    # 그대로 나갔고 문자열 정리도 받지 못했다(RQMT_TM에 끝 공백이 남았다).
    TAR_ADDR_NM: {label: 주소, type: str, unit: ""}
    # 강릉 79곳이 128.455~129.068 · 37.608~38.146 범위였다. 경위도가 맞다.
    XCRD: {label: 경도, type: float, unit: ""}
    YCRD: {label: 위도, type: float, unit: ""}
    KVK_TAR_ID: {label: 연계식별자, type: str, unit: ""}
    # 79곳 중 두 곳만 채워져 있었다("2016열린관광지",
    # "2023반려동물 친화관광지 100선"). 선정·인증 표시로 보인다.
    CATE_NM: {label: 선정표시, type: str, unit: ""}
    # 뜻을 확인하지 못했다. 이름은 콘텐츠 수·소요시간처럼 보이지만
    # 사이트가 이 값을 어디에 쓰는지 확인하기 전에는 단정하지 않는다.
    NO_CONT: {label: NO_CONT_원값, type: int, unit: ""}
    RQMT_TM: {label: RQMT_TM_원값, type: str, unit: ""}

LN_05_01_002:
