# ── 2026-08-24 추가 — 중심관광지 ────────────────────────────────
# 조회 축이 여기만 **시군구**다(위의 것들은 `CONT_ID`). 그 지역
# 관광 동선의 허브가 어디인지를 중심도로 매긴다.
#
# **여러 달을 물으면 100행에서 잘린다.** 강릉시를 202605~202607 로
# 물으면 100행이 오는데 그중 99행이 202607 이고 202606 은 한 행뿐,
# 202605 는 아예 없다. 한 달씩 물으면 각각 100행이 온다
# (2026-08-24 확인). **달을 넘겨 견주려면 한 달씩 부른다.**

LN_03_01_043:
  name: 중심관광지 100위
  screen: /datalab/portal/loc/getTourLocalDataForm.do
  auth: public
  params: [SGG_CD, BASE_YM1, BASE_YM2, srchAreaDate]
  fixed_params: {srchAreaDate: "1"}
  granularity: month
  section: 매력
  query_axis: 지역
  caution: >-
    **한 달씩 불러라.** 여러 달을 물으면 100행에서 잘려 이전 달이
    거의 사라진다 — 강릉 202605~202607 은 100행 중 99행이 202607
    이었다(2026-08-24 확인).
    `DGRE_CNTRL`(중심도)은 순위를 매기는 값이고 **단위가 없다.**
    강릉 2026-07 은 강릉중앙시장 4.48 · 경포해변 2.95다. 배수로
    읽지 마라 — 무엇을 정규화한 값인지 데이터랩이 밝히지 않았다.
    **숙박시설이 함께 순위에 든다**(신라모노그램 3위, 세인트존스호텔
    5위). 관광지만 보려면 `CNTRL_CATE_NM_LARGE` 로 걸러라.
    좌표(`*_COORD`)가 함께 오므로 지도에 찍을 수 있다.
  columns:
    CNTRL_POI_ID: {label: 중심관광지ID, type: str, unit: ""}
    MD5_POI_ID: {label: POI_해시, type: str, unit: ""}
    CNTRL_SIDO_CD: {label: 시도코드, type: str, unit: ""}
    CNTRL_SIDO_NM: {label: 시도명, type: str, unit: ""}
    CNTRL_SGG_CD: {label: 시군구코드, type: str, unit: ""}
    CNTRL_SGG_NM: {label: 시군구명, type: str, unit: ""}
    CNTRL_POI_X_COORD: {label: 경도, type: float, unit: ""}
    CNTRL_POI_Y_COORD: {label: 위도, type: float, unit: ""}
    CNTRL_TAR_NM: {label: 중심관광지명, type: str, unit: ""}
    CNTRL_CATE_NM_LARGE: {label: 대분류, type: str, unit: ""}
    CNTRL_CATE_NM_MIDL: {label: 중분류, type: str, unit: ""}
    DGRE_CNTRL: {label: 중심도, type: float, unit: ""}
    BASE_YM: {label: 기준월, type: str, unit: ""}
    RK: {label: 순위, type: float, unit: ""}
