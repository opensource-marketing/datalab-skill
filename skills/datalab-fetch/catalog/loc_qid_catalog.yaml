LN_02_01_009:
  name: 내비 목적지 유형별 검색량(월별)
  screen: /datalab/portal/loc/getAreaDataForm.do
  auth: public
  params: [SGG_CD, BASE_YM1, BASE_YM2, sggIntgYnFlag]
  fixed_params: {sggIntgYnFlag: "N", srchAreaDate: "1"}
  granularity: month
  section: 매력
  caution: >-
    **`TOU_DIV_NM='전체'` 행이 섞여 있다.** 아홉 유형과 함께 오므로
    걸러내지 않고 더하면 두 배가 된다 — 강릉시 2024-01 은 아홉 유형
    합이 437,740 으로 '전체' 행과 정확히 같다(2026-08-24 검산).
    **`JURI_TOU_NUM`·`OJURI_TOU_NUM`·`FRN_TOU_NUM`·
    `JURI_OJURI_TOTL_TOU_NUM`·`TOTL_TOU_NUM` 은 늘 0 이다** — 현지인·
    외지인·외국인으로 나눠 볼 수 있을 것처럼 보이지만 값이 오지
    않는다. 쓰는 컬럼은 `EXT_TOU_NUM` 하나뿐이다.
    **검색 건수이지 방문자가 아니다.** '숙박' 행이 곧
    `LN_03_01_054`(숙박 목적지 검색건수)와 같은 값이다(82,745).
    `ORD` 는 화면 정렬 순서이고 기타관광만 99다.
  columns:
    BASE_DATE: {label: 기준월, type: str, unit: ""}
    TOU_DIV_NM: {label: 목적지_유형, type: str, unit: ""}
    EXT_TOU_NUM: {label: 검색건수, type: float, unit: 건}
    JURI_TOU_NUM: {label: 현지인_검색건수_미제공, type: float, unit: ""}
    OJURI_TOU_NUM: {label: 외지인_검색건수_미제공, type: float, unit: ""}
    FRN_TOU_NUM: {label: 외국인_검색건수_미제공, type: float, unit: ""}
    JURI_OJURI_TOTL_TOU_NUM: {label: 내국인_검색건수_미제공, type: float, unit: ""}
    TOTL_TOU_NUM: {label: 전체_검색건수_미제공, type: float, unit: ""}
    ORD: {label: 정렬순서, type: float, unit: ""}

# ── 2026-08-24 추가 — 어디서 온 사람이 무엇을 하는가 ────────────
# **`DPTR_REGN_NM` 이라는 같은 컬럼 이름이 지표마다 다른 것을 담는다.**
# `LN_03_01_053` 에서는 출발 시도인데 아래 둘에서는 관광 유형이다.
# 이름을 믿고 지역명으로 쓰면 표가 통째로 어긋난다.

LN_03_01_011:
  name: 유입 지역별 목적지 유형 분포
  screen: /datalab/portal/loc/getAreaDataForm.do
  auth: public
  params: [SGG_CD, BASE_YM1, BASE_YM2, sggIntgYnFlag]
  fixed_params: {sggIntgYnFlag: "N", srchAreaDate: "1"}
  granularity: period
  section: 어디서
  caution: >-
    **`DPTR_REGN_NM` 은 출발 지역이 아니라 관광 대분류다**(음식·숙박·
    자연관광…). 출발 지역은 `FROM_NM` 이고 `TO_NM` 은 물어본 지역
    하나로 고정이다.
    **두 층이 섞여 있다.** `TOU_NUM`·`TOU_NUM_RATE` 는 대분류 값이라
    같은 대분류의 모든 행에 반복된다 — 강릉시 2024년 1~3월은 4,335행
    인데 대분류는 아홉이고 그 비중 합이 100.0%다(2026-08-24 검산).
    행을 그대로 더하면 수백 배가 된다. `DTL_*` 가 출발지 × 소분류
    값이다.
    `*_SQRT` 는 제곱근이다(지도 원 크기용, 통계가 아니다).
    행이 매우 많다 — 석 달에 4,335행이므로 기간을 좁혀 부른다.
  columns:
    FROM_NM: {label: 출발_시군구, type: str, unit: ""}
    TO_NM: {label: 도착_시군구, type: str, unit: ""}
    DPTR_REGN_NM: {label: 관광_대분류, type: str, unit: ""}
    DPTR_REGN_DTL_NM: {label: 관광_소분류, type: str, unit: ""}
    TOU_NUM: {label: 대분류_방문자수, type: float, unit: 명}
    TOU_NUM_SQRT: {label: 대분류_방문자수_제곱근, type: float, unit: ""}
    TOU_NUM_RATE: {label: 대분류_비중, type: float, unit: "%"}
    DTL_TOU_NUM: {label: 출발지별_소분류_방문자수, type: float, unit: 명}
    DTL_TOU_NUM_SQRT: {label: 소분류_방문자수_제곱근, type: float, unit: ""}
    DTL_TOU_NUM_RATE: {label: 소분류_비중, type: float, unit: "%"}

LN_03_01_012:
  name: 유출 지역별 목적지 유형 분포
  screen: /datalab/portal/loc/getAreaDataForm.do
  auth: public
  params: [SGG_CD, BASE_YM1, BASE_YM2, sggIntgYnFlag]
  fixed_params: {sggIntgYnFlag: "N", srchAreaDate: "1"}
  granularity: period
  section: 어디서
  caution: >-
    `LN_03_01_011` 을 뒤집은 것이다 — `FROM_NM` 이 물어본 지역 하나로
    고정이고 `TO_NM` 이 여럿이다. **여기서도 `DPTR_REGN_NM` 은 출발
    지역이 아니라 관광 대분류다.**
    이 지역 사람이 어디로 나가 무엇을 하는지를 본다. **관광객이
    아니라 유출이다** — 방문자 지표와 섞어 "우리 지역 관광객"으로
    말하면 안 된다. 두 층이 섞인 것은 `_011` 과 같다.
  columns:
    FROM_NM: {label: 출발_시군구, type: str, unit: ""}
    TO_NM: {label: 도착_시군구, type: str, unit: ""}
    DPTR_REGN_NM: {label: 관광_대분류, type: str, unit: ""}
    DPTR_REGN_DTL_NM: {label: 관광_소분류, type: str, unit: ""}
    TOU_NUM: {label: 대분류_방문자수, type: float, unit: 명}
    TOU_NUM_SQRT: {label: 대분류_방문자수_제곱근, type: float, unit: ""}
    TOU_NUM_RATE: {label: 대분류_비중, type: float, unit: "%"}
    DTL_TOU_NUM: {label: 도착지별_소분류_방문자수, type: float, unit: 명}
    DTL_TOU_NUM_SQRT: {label: 소분류_방문자수_제곱근, type: float, unit: ""}
    DTL_TOU_NUM_RATE: {label: 소분류_비중, type: float, unit: "%"}

