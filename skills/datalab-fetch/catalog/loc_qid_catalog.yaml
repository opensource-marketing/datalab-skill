  granularity: month
  section: 체류 깊이
  caution: >-
    외국인만이다. 강남구는 숙박 비중이 15.6%로 외지인(3.4%)의 네 배가
    넘는다(2024-01, 2026-08-24 확인) — 외국인은 오래 머무는 사람이
    많아서이지 강남이 숙박도시라서가 아니다.
    **`LN_02_01_013`('전체')의 평균 숙박일이 이 지표와 같은 값이다.**
    둘을 함께 실으면 "전체와 외국인이 똑같다"는 잘못된 문장이 나온다.
    `SIDO_NM` 은 이름과 달리 시군구명이 온다.
  columns:
    BASE_YM: {label: 기준월, type: str, unit: ""}
    SIDO_NM: {label: 지역명, type: str, unit: ""}
    LODG_TOU_NUM_RATE: {label: 숙박방문자_비중, type: float, unit: "%"}
    AVG_LODG_DAYS: {label: 평균_숙박일, type: float, unit: 일}

