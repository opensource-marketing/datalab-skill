LN_02_01_013:
  name: 숙박 방문자 비중·평균 숙박일(전체, 월별)
  screen: /datalab/portal/loc/getAreaDataForm.do
  auth: public
  params: [SGG_CD, BASE_YM1, BASE_YM2, srchAreaDate, tabDiv, dispYn]
  fixed_params: {srchAreaDate: "1", tabDiv: "1", dispYn: "Y"}
  granularity: month
  section: 체류 깊이
  caution: >-
    **이름이 '전체'인데 `AVG_LODG_DAYS` 는 외국인 값과 같다.**
    강남구 2024년 열두 달 전부 `LN_02_01_013_02`(외국인)와 소수점
    둘째 자리까지 일치했다(3.37·3.32·3.38…, 2026-08-24 확인).
    같은 달 외지인은 2.86·2.82·2.91 로 0.5일쯤 짧다. 강릉시에서도
    같았다. **"전체 평균 숙박일"로 옮겨 적으면 외국인 숫자를
    전체라고 말하는 셈이다** — 강남구는 외국인이 15.6%뿐이다.
    `LODG_TOU_NUM_RATE` 는 외지인보다 조금 크므로(3.5 대 3.4)
    비율 쪽은 전체로 보인다. 숙박일이 필요하면 어느 계열인지
    밝히고 `_013_01`(외지인)·`_013_02`(외국인)를 직접 쓴다.
    `SIDO_NM` 은 이름과 달리 **시군구명**이 온다.
  columns:
    BASE_YM: {label: 기준월, type: str, unit: ""}
    SIDO_NM: {label: 지역명, type: str, unit: ""}
    LODG_TOU_NUM_RATE: {label: 숙박방문자_비중, type: float, unit: "%"}
    AVG_LODG_DAYS: {label: 평균_숙박일, type: float, unit: 일}

LN_02_01_013_02:
  name: 숙박 방문자 비중·평균 숙박일(외국인, 월별)
