    **TURSM_DNS_DIV_VAL2가 순위이고 TURSM_DNS_DIV_VAL은 순위가 아니다**
    — 후자는 순위를 뒤집은 값이라 클수록 좋다. 큰 쪽을 순위로 읽으면
    6등을 246등으로 본다.
    **모집단을 사이트가 주지 않는다.** 두 값의 합이 251 또는 252로
    축마다 다른데(값이 없는 지역이 축마다 다르기 때문으로 보인다)
    확인하지 못했다. "몇 곳 중 몇 위"라고 쓰려면 모집단을 지어내야
    하므로, **순위만 적고 모집단은 적지 마라.**
    TA_01_03_001(관광수요 경쟁력)과 축 이름도 값도 다르다. 섞지 마라.
  columns:
    SGGCD: {label: 시군구코드, type: str, unit: ""}
    SEQ: {label: 순번, type: str, unit: ""}
    SGG_NM: {label: 지역명, type: str, unit: ""}
    TURSM_DNS_DIV_NM: {label: 축, type: str, unit: ""}
