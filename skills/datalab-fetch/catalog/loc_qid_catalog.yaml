    빠져 있다.** 현지인(`_058_01`)을 더하면 `LN_03_03_058`(내국인)이
    된다 — 셋을 나란히 실으면 합계를 또 더하기 쉽다.
  columns:
    BASE_DATE: {label: 기준월, type: str, unit: ""}
    SGG_NM: {label: 지역명, type: str, unit: ""}
    CARD_AMT: {label: 지역_카드소비, type: float, unit: ""}
    TOTL_CARD_AMT: {label: 전국_카드소비, type: float, unit: ""}
    CARD_PER: {label: 전국_대비_비중, type: float, unit: "%"}

LN_03_01_005:
  name: 같은 시도 시군구 체류 비교(외지인)
  screen: /datalab/portal/loc/getAreaDataForm.do
  auth: public
  params: [SGG_CD, BASE_YM1, BASE_YM2, sggIntgYnFlag]
  fixed_params: {sggIntgYnFlag: "N", srchAreaDate: "1"}
  granularity: period
  section: 체류 깊이
  caution: >-
    **`SIDO_CD`·`SIDO_NM` 이름과 달리 시군구가 온다**(51110 춘천시).
    같은 시도의 모든 시군구가 오고 **물어본 지역 자신도 들어 있다** —
    강원 열여덟 시군구가 다 왔다(2026-08-24 확인). 순위를 매길 때
    자기 행을 빼야 "몇 위"가 맞는다. 개수는 시도마다 다르다.
    `SIDO_AVG_STAY_TM` 은 분 단위로 보이나 데이터랩이 밝히지 않았고,
    `STAY_TM` 과 자릿수가 크게 달라(368 대 1,829) 둘을 같은 단위로
