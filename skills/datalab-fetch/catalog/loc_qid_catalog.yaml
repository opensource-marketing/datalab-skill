LN_04_01_013:
  name: 지역관광진단 좌표(체류시간·숙박비율)
  screen: /datalab/portal/loc/getAreaDataForm.do
  auth: public
  params: [SGG_CD, BASE_YM1, BASE_YM2]
  fixed_params: {srchAreaDate: "1", tabDiv: "1", dispYn: "Y"}
  granularity: period
  section: 체류 깊이
  caution: >-
    **컬럼 이름이 SIDO_ 인데 시군구 값이 들어온다.** 51150 을 넣으면
    SIDO_CD 가 '51150', SIDO_NM 이 '강릉시'다. SGG_ 쪽 네 컬럼은
    빈 문자열과 0으로 온다(2026-08-24 확인). 이름을 믿지 마라.
    **값은 체류시간이 아니라 좌표다.** 진단 사분면에 점을 찍으려고
    만든 값이라 음수가 나온다 — 강원도(51)로 부르면 -887.07 이고
    강릉시는 +1016.54, 춘천시는 +1202.80 이다. 분으로 읽으면
    "체류시간이 마이너스"가 된다. 실제 체류시간은 LN_02_01_012
    (EXT_TOU_NUM, 분)에 있다. 단위를 적지 마라.
