    강릉시는 2024-01 에 현지인 1,971 대 외지인 55,049 로 외지인이
    28배다(2026-08-24 확인). 이 표만 보고 "소비가 작다"고 읽으면
    관광도시를 정반대로 말하게 된다. 현지인 + 외지인 = `LN_03_03_058`.
  columns:
    BASE_DATE: {label: 기준월, type: str, unit: ""}
    SGG_NM: {label: 지역명, type: str, unit: ""}
    CARD_AMT: {label: 지역_카드소비, type: float, unit: ""}
    TOTL_CARD_AMT: {label: 전국_카드소비, type: float, unit: ""}
    CARD_PER: {label: 전국_대비_비중, type: float, unit: "%"}

LN_03_03_058_02:
  name: 전국 대비 관광소비 비중(외지인, 월별)
  screen: /datalab/portal/loc/getAreaDataForm.do
  auth: public
  params: [SGG_CD, BASE_YM1, BASE_YM2, sggIntgYnFlag]
  fixed_params: {sggIntgYnFlag: "N", srchAreaDate: "1"}
  granularity: month
