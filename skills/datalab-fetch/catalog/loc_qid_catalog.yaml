  granularity: month
  section: 어디서
  caution: >-
    **내비게이션 검색 건수이지 방문자 수가 아니다.** 컬럼 이름이
    `PSON_NUM`("인원")이지만 화면은 '숙박 목적지 검색건수'로 그린다.
    숙박 수요를 앞질러 보는 값이지 실제로 묵은 사람 수가 아니다.
    **`PREYR_PSON_NUM`·`GROW_RATE` 는 늘 비어 있다**(강릉시 2024년
    열두 달 전부 null, 2026-08-24 확인) — 화면 코드도 그 둘이 비면
    범례에서 '전년동기'를 빼도록 짜여 있다. 전년 대비를 말하려면
    직접 두 해를 불러 나눈다.
  columns:
    BASE_DATE: {label: 기준_타임스탬프, type: float, unit: ""}
    BASE_YM: {label: 기준월, type: str, unit: ""}
    PRE_BASE_YM: {label: 전년동월, type: str, unit: ""}
    PSON_NUM: {label: 검색건수, type: float, unit: 건}
    PREYR_PSON_NUM: {label: 전년동월_검색건수, type: float, unit: 건}
    GROW_RATE: {label: 전년대비_증감률, type: float, unit: "%"}

# ── 2026-08-24 추가 — 현지인과 외지인이 무엇을 찾는가 ────────────
# 어느 컬럼이 현지인인지는 형제 지표로 가렸다. `LN_03_01_046` 은
# 외지인만 주는데 그 값이 `_045` 의 `CD_RAT2` 와 아홉 업종 전부
# 같았다(강릉 2024년: 음식 40.4 · 숙박 19.2 · 자연관광 17.6 …).
# 그러므로 남은 `CD_RAT` 가 현지인이다. **컬럼 이름만으로는 결코
# 알 수 없었다** — CD_RAT·CD_RAT2 에는 아무 뜻이 없다.

LN_03_01_045:
  name: 내비 관심지점 업종 비중(현지인·외지인)
  screen: /datalab/portal/loc/getAreaDataForm.do
  auth: public
  params: [SGG_CD, BASE_YM1, BASE_YM2, sggIntgYnFlag]
  fixed_params: {sggIntgYnFlag: "N", srchAreaDate: "1"}
  granularity: period
  section: 매력
  caution: >-
    **`CD_RAT` 가 현지인, `CD_RAT2` 가 외지인이다.** 컬럼 이름에는
    단서가 없어서 형제 지표(`LN_03_01_046`, 외지인만)와 맞춰 가렸다 —
    아홉 업종 값이 전부 일치했다(강릉시 2024년, 2026-08-24 검산).
    두 열 각각 합이 100%다. **차이가 뜻을 만든다** — 강릉은 현지인이
    음식을 43.9% 찾는데 외지인은 40.4%이고, 자연관광은 현지인 13.3%
    대 외지인 17.6%다. 사는 사람과 오는 사람이 같은 도시를 다르게
    쓴다. 내비게이션 **검색** 비중이지 실제 방문이 아니다.
    업종 개수는 지역·기간마다 다를 수 있으니 못 박지 마라.
  columns:
    CD_NM: {label: 업종, type: str, unit: ""}
    CD_RAT: {label: 현지인_비중, type: float, unit: "%"}
    CD_RAT2: {label: 외지인_비중, type: float, unit: "%"}

LN_03_01_046:
  name: 내비 관심지점 업종 비중(외지인)
  screen: /datalab/portal/loc/getAreaDataForm.do
  auth: public
  params: [SGG_CD, BASE_YM1, BASE_YM2, sggIntgYnFlag]
  fixed_params: {sggIntgYnFlag: "N", srchAreaDate: "1"}
  granularity: period
  section: 매력
  caution: >-
    외지인만이다. 같은 값이 `LN_03_01_045` 의 `CD_RAT2` 로도 온다 —
    현지인과 견주려면 그쪽 한 번으로 끝난다. 합은 100%다(강릉시
    2024년 99.9, 반올림, 2026-08-24 검산). 내비게이션 검색 비중이지
    실제 방문이 아니다.
  columns:
    CD_NM: {label: 업종, type: str, unit: ""}
    CD_RAT: {label: 외지인_비중, type: float, unit: "%"}

# ── 2026-08-24 추가 — 전국 대비 소비 삼형제와 시도 안 비교 ──────
# 세 지표가 산술로 맞물린다: 현지인 + 외지인 = 내국인. 강릉시 2024년
# 열두 달 전부 `CARD_AMT` 도 `TOTL_CARD_AMT` 도 1 이내로 맞았다
# (2026-08-24 검산). 셋을 함께 실으면 합계 행을 또 더하는 사고가
# 나기 쉬우니, 어느 계열인지 반드시 밝힌다.

LN_03_03_058:
  name: 전국 대비 관광소비 비중(내국인, 월별)
  screen: /datalab/portal/loc/getAreaDataForm.do
  auth: public
  params: [SGG_CD, BASE_YM1, BASE_YM2, sggIntgYnFlag]
  fixed_params: {sggIntgYnFlag: "N", srchAreaDate: "1"}
  granularity: month
  section: 소비
  caution: >-
    `CARD_AMT` 는 이 지역, `TOTL_CARD_AMT` 는 전국이고 `CARD_PER` 가
    그 비중이다. **`CARD_PER` 는 소수점 한 자리라 작은 지역에서는
    0.5% 처럼 뭉개진다** — 견주려면 두 금액으로 직접 나눈다.
    현지인(`_058_01`) + 외지인(`_058_02`) = 이 지표다(강릉시 2024년
    열두 달, 2026-08-24 검산). **외국인은 빠져 있다.**
    단위는 백만원으로 보이나 데이터랩이 밝히지 않아 못 박지 않는다 —
    비중과 추이로 쓰고 절대액은 다른 지표와 견주지 마라.
  columns:
    BASE_DATE: {label: 기준월, type: str, unit: ""}
    SGG_NM: {label: 지역명, type: str, unit: ""}
    CARD_AMT: {label: 지역_카드소비, type: float, unit: ""}
    TOTL_CARD_AMT: {label: 전국_카드소비, type: float, unit: ""}
    CARD_PER: {label: 전국_대비_비중, type: float, unit: "%"}

LN_03_03_058_01:
  name: 전국 대비 관광소비 비중(현지인, 월별)
  screen: /datalab/portal/loc/getAreaDataForm.do
  auth: public
