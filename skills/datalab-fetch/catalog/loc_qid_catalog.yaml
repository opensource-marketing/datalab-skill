# 한국관광 데이터랩 qid 카탈로그 — 지역(시군구) 영역
#
# 인바운드 카탈로그(qid_catalog.yaml)와 구조는 같으나 axis 대신 section을 쓴다.
# 지역 스킬은 종합점수를 매기지 않으므로 축(axis) 개념이 없다.
#
# auth: public = 쿠키 불필요 / session = 로그인 세션 필요
# fixed_params: 누락하면 빈 배열이나 껍데기 레코드가 오는 숨은 필수 파라미터
#   - dispYn=Y 가 없으면 LN_04_01_009 계열이 값 없는 레코드를 돌려준다
#
# *_SQRT 컬럼은 앞 컬럼의 제곱근이다(차트 버블 크기용). 리포트에 쓰지 않는다.
#
# ── 소비 금액 단위(2026-08-22 확정) ─────────────────────────────
# 예전에는 "사이트가 어디에도 표기하지 않으니 비율로만 읽으라"고 적어 두었다.
# 이제는 안다. 같은 지역·기간의 같은 금액을 세 지표가 다른 단위로 주는데,
# 그중 두 개는 사이트가 차트에 단위를 선언한다.
#
#   LN_10_02_004 국가별 외국인 소비   사이트 선언 '원'      350,492,923,588
#   LN_10_02_002 업종별 외국인 소비   사이트 선언 '천원'    350,492,925
#   LN_04_01_006_001 업종별 소비      (선언 없음)           350,492,924  → 천원
#   LN_03_03_059 CARD_AMT            (선언 없음)           350,493      → 백만원
#
# 종로구 2024년 전체로 셋이 0.000% 오차로 맞는다. 그래서 단위가 확정된다.
# **컬럼마다 다르다. 하나로 뭉뚱그리지 마라.**
# ────────────────────────────────────────────────────────────────

LN_04_01_022:
  name: 지역 방문자 수(월별)
  screen: /datalab/portal/loc/getAreaDataForm.do
  auth: public
  params: [SGG_CD, BASE_YM1, BASE_YM2, srchAreaDate, tabDiv, dispYn]
  fixed_params: {srchAreaDate: "1", tabDiv: "1", dispYn: "Y"}
  granularity: month
  caution: >-
    **현지인을 뺀 값이다(외지인+외국인).** 2026-08-23 확인 —
    강릉 2024년 33,584,271이 BDT_01_01_002의 touDivCd=4와 정확히
    같았고, 그 값은 2(외지인 33,233,340) + 3(외국인 350,931)로
    맞아떨어진다. 구분을 고를 수 없다(tabDiv 1·2·3이 모두 같은 값).
    순 방문자 수(LN_02_01_011_001)와는 다르다 — 이쪽은 연인원이다.
  section: 규모·추세
  columns:
    BASE_DATE: {label: 기준월, type: str, unit: ""}
    TOU_DIV_NM: {label: 지역명, type: str, unit: ""}
    TOTL_TOU_NUM: {label: 방문자수, type: float, unit: 명}

