LN_03_012_001_001:
  caution: 조회 창의 **시작월**이 아직 목록이 확정되지 않은 해이면 빈 배열이 온다. 유료관광지점 목록이 연 단위로 확정되기 때문으로 보인다 — 2026-08 기준으로 2026-01~2026-07은 0행이고 2025-12~2026-07은 값이 나온다. 올해만 보고 싶어도 창의 시작을 지난해 안으로 잡아야 한다.
  # 이 리포트에서 유일한 실측 수치다. 나머지 방문자 지표는 이동통신
  # 기반 추정이지만 이것은 매표 집계다. 표에서 구분해 표기하라.
  #
  # 한 관광지점당 월별로 한 행씩 온다(20개 지점 × 12개월 = 240행).
  # TOTAL_NUM은 그 지점의 기간 합계가 모든 행에 되풀이된다 —
  # 월별 값을 더하면 TOTAL_NUM과 일치함을 확인했다(오죽헌 482,360).
  # 합계를 다시 합하지 않도록 주의하라.
  name: 주요 유료관광지점 입장객 수(전체)
  screen: /datalab/portal/loc/getAreaDataForm.do
  auth: public
  params: [SGG_CD, BASE_YM1, BASE_YM2, srchAreaDate, tabDiv, dispYn]
  fixed_params: {srchAreaDate: "1", tabDiv: "1", dispYn: "Y"}
  granularity: month
  section: 매력
