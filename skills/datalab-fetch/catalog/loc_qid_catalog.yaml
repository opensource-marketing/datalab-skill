    SGG_NM: {label: 시군구명_미사용, type: str, unit: ""}
    SGG_AVG_STAY_TM: {label: 시군구_체류_좌표값_미사용, type: float, unit: ""}
    SGG_AVG_LODG_TOU_RAT: {label: 시군구_숙박비율_좌표값_미사용, type: float, unit: ""}

