LN_04_01_011:
  name: 향후 30일간 지역 집중률(사이트가 숨긴 차트)
  screen: /datalab/portal/loc/getAreaDataForm.do
  auth: public
  params: [SGG_CD, BASE_YM1, BASE_YM2]
  fixed_params: {SGG_NM: "", srchAreaDate: "1", tabDiv: "1", dispYn: "Y"}
  granularity: day
  section: 예측
  caution: >-
    **이 저장소에서 몇 안 되는 미래 값이다.** BASE_DATE 가 오늘부터
    앞으로의 날짜다(2026-08-24 조회에서 20260823~20260913, 22일치).
    요청한 BASE_YM 과 무관하게 늘 지금 기준으로 온다.
    **값이 무엇인지 사이트가 밝히지 않는다.** 화면 제목은 '향후
    30일간 지역 집중률'인데 화면 코드의 dnname 은 '향후 30일간
    방문자 수 예측'이다. 값은 18.01~93.24이고 합이 1031이라 백분율이
    아니다 — **방문자 수로 읽지 마라.** 날짜 사이의 높낮이로만 읽고
    단위는 적지 마라.
    **사이트가 이 차트를 숨겨 두었다**(화면 코드에 `$('#1282_DIV').hide();`
    와 '2024.01.09 고객요청으로 미표시' 주석). 서버는 응답하지만
    예고 없이 끊길 수 있다.
    **수록 시점 표(coverage.yaml)의 값은 이 지표에 뜻이 없다.**
    어떤 기간을 물어도 값이 오므로 탐사기가 늘 최신 달을 적는다.
  columns:
    BASE_DATE: {label: 기준일, type: str, unit: ""}
    LRFRN_VISITR_ESTI_NUM: {label: 집중률_추정값, type: float, unit: ""}

LN_02_01_005:
  name: 향후 5주 요일별 방문 집중률
  screen: /datalab/portal/loc/getAreaDataForm.do
  auth: public
  params: [SGG_CD, BASE_YM1, BASE_YM2]
  fixed_params: {SGG_NM: "", srchAreaDate: "1", tabDiv: "1", dispYn: "Y"}
  granularity: day
  section: 예측
  caution: >-
    35행이 온다 — 5주(WK 1~5) × 7요일이다. PREDICT_YMD 가 **앞으로의
    날짜**이며(2026-08-24 조회에서 20260824~20260927) 요청한 기간과
    무관하게 지금 기준으로 온다. VISIT_RAT 이 그 날의 집중률(%)이고
    35행을 다 더하면 100이다(2026-08-24: 100.2, 반올림 때문).
    TOU_NUM 은 그 요일의 과거 방문자 수로 보이나 사이트가 무엇을
    센 값인지 밝히지 않아 확정하지 못했다 — 35행 합 2,297,421.
    **이것도 사이트가 숨긴 차트다**(위 LN_04_01_011 참고).
