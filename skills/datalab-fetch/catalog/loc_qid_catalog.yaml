LN_03_01_053:
  name: 숙박 목적지 유입 지역 분포
  screen: /datalab/portal/loc/getAreaDataForm.do
  auth: public
  params: [SGG_CD, BASE_YM1, BASE_YM2, sggIntgYnFlag]
  fixed_params: {sggIntgYnFlag: "N", srchAreaDate: "1"}
  granularity: period
  section: 어디서
  caution: >-
    **두 쌍의 컬럼이 서로 다른 층을 센다. 섞어 더하면 안 된다.**
    `TOU_NUM`·`TOU_NUM_RATE` 는 출발 **시도** 값이고 그 시도의 모든
    시군구 행에 똑같이 반복된다 — 244행을 그대로 더하면 비율 합이
    2,408%가 된다. 시도를 중복 제거하면 99.9%다(강릉시 2024년,
    2026-08-24 검산). `DTL_*` 는 **그 시도 안에서의** 시군구 비율
    이라 시도마다 100%씩이고 전부 더하면 1,500%다.
    `*_SQRT` 는 제곱근이다(90,742 → 301) — 지도 원 크기를 그리려고
    넣은 값이지 통계가 아니다.
    행 수는 지역·기간마다 다르니 못 박지 마라.
  columns:
    DPTR_REGN_NM: {label: 출발_시도, type: str, unit: ""}
    DPTR_REGN_DTL_NM: {label: 출발_시군구, type: str, unit: ""}
    TOU_NUM: {label: 시도_방문자수, type: float, unit: 명}
    TOU_NUM_SQRT: {label: 시도_방문자수_제곱근, type: float, unit: ""}
    TOU_NUM_RATE: {label: 시도_비중, type: float, unit: "%"}
    DTL_TOU_NUM: {label: 시군구_방문자수, type: float, unit: 명}
    DTL_TOU_NUM_SQRT: {label: 시군구_방문자수_제곱근, type: float, unit: ""}
    DTL_TOU_NUM_RATE: {label: 시도내_시군구_비중, type: float, unit: "%"}

