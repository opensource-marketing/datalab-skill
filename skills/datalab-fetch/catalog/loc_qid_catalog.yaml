LN_02_01_007:
  name: 성·연령별 내국인 관광소비 분포
  screen: /datalab/portal/loc/getAreaDataForm.do
  auth: public
  params: [SGG_CD, BASE_YM1, BASE_YM2, srchAreaDate, tabDiv, dispYn, sggIntgYnFlag]
  # sggIntgYnFlag 없이는 빈 배열도 아니고 0바이트 본문이 온다.
  # 형제 지표(LN_02_01_004)는 없어도 되는데 이쪽만 필수다.
  fixed_params: {srchAreaDate: "1", tabDiv: "1", dispYn: "Y", sggIntgYnFlag: "N"}
  granularity: month
  section: 소비
  caution: >-
    **연령 구간이 방문자 지표(`LN_02_01_004`)와 다르다.** 여기는
    '80대'·'10대'이고 저쪽은 '70세 이상'·'10~19세'·'0~9세'다 —
    나란히 놓고 "이 연령대가 많이 오는데 적게 쓴다"고 말하려면
    구간부터 맞춰야 한다. 그대로 겹치면 서로 다른 사람을 견주게 된다.
    `TOU_NUM1` 이 남성, `TOU_NUM2` 가 여성이다(형제 지표
    `LN_02_01_004` 의 검증된 체계와 같다). 두 비중을 합쳐 100%이고
    강릉시 2024년은 남성 59.3 · 여성 40.6 이다(2026-08-24 확인) —
    **한쪽만 100%로 읽으면 안 된다.**
    금액 자릿수가 크다(80대 24억). 내국인만이며 외국인은 빠져 있다.
  columns:
    AGEG_DIV_NM: {label: 연령대, type: str, unit: ""}
    TOU_NUM1: {label: 남성_소비액, type: float, unit: 원}
    TOU_NUM1_RATE: {label: 남성_비중, type: float, unit: "%"}
    TOU_NUM2: {label: 여성_소비액, type: float, unit: 원}
    TOU_NUM2_RATE: {label: 여성_비중, type: float, unit: "%"}

LN_03_01_058:
  name: 관광소비 월별·연누계(전국 대비)
  screen: /datalab/portal/loc/getAreaDataForm.do
  auth: public
  params: [SGG_CD, BASE_YM1, BASE_YM2, sggIntgYnFlag]
  fixed_params: {sggIntgYnFlag: "N", srchAreaDate: "1"}
  granularity: month
  section: 소비
  caution: >-
    **`LN_03_03_058` 과 이름이 거의 같은 다른 지표다.** 월 소비액
    (`CARD_AMT`)은 같지만 이쪽은 **연 누계**(`YEAR_CARD_AMT`)를 함께
    주고 `CARD_PER` 가 소수점 둘째 자리다(0.43 대 0.4) — 작은 지역을
    견줄 때는 이쪽이 낫다. 전국 합계는 서로 조금 다르다(2024-12:
    13,851,751 대 13,891,110, 2026-08-24 확인) — **두 지표의 비중을
    같은 표에 섞지 마라.**
    **행이 최신 달부터 거꾸로 온다.** 그대로 그리면 시간이 거꾸로
    흐른다. `SPPY_YEAR_PER`·`TOTL_SPPY_YEAR_PER` 는 늘 비어 있다.
    `DIV_VAL` 은 '올해' 한 값만 왔다.
    단위는 데이터랩이 밝히지 않아 못 박지 않는다.
  columns:
    BASE_YM: {label: 기준월, type: str, unit: ""}
    SIDO_NM: {label: 시도명, type: str, unit: ""}
    SGG_NM: {label: 시군구명, type: str, unit: ""}
    CARD_AMT: {label: 월_카드소비, type: float, unit: ""}
    CARD_PER: {label: 월_전국대비_비중, type: float, unit: "%"}
    TOTL_CARD_AMT: {label: 월_전국_카드소비, type: float, unit: ""}
    YEAR_CARD_AMT: {label: 연누계_카드소비, type: float, unit: ""}
    YEAR_CARD_PER: {label: 연누계_전국대비_비중, type: float, unit: "%"}
    SPPY_YEAR_PER: {label: 전년동기_비중_미제공, type: float, unit: ""}
    TOTL_SPPY_YEAR_PER: {label: 전국_전년동기_비중_미제공, type: float, unit: ""}
    DIV_VAL: {label: 구분, type: str, unit: ""}

# ── 2026-08-24 — 값은 오는데 넣지 않은 것 ───────────────────────
# 마지막 훑기에서 값이 온 것들이다. 무엇을 세는지 확인하지 못했다.
#
# `LN_03_01_022`·`LN_03_01_031` — 유사지역 비교로 보인다. `_031` 은
#   0.9998 같은 유사도 값을 주는데 무엇으로 잰 유사도인지 화면
#   코드에 `dnname` 이 없어 확인할 수 없었다.
# `LN_03_01_019`·`LN_03_01_033` — 모든 값이 빈 문자열이다(AI 관광
#   분석 자리인데 내용이 없다).
# `LN_03_01_023_999`·`LN_03_01_027_999`·`LN_03_01_040_2` — 상위 몇
#   개만 오는 순위표다. `GROW_RATE_TOU_NUM` 이 빈 문자열이거나
#   `PRE_*` 컬럼이 통째로 null 이라 전년 대비를 말할 수 없고,
#   무엇을 기준으로 상위를 고르는지도 알 수 없다.
# `LN_02_01_004_01` — `LN_02_01_004` 와 값이 똑같은 축소판.
