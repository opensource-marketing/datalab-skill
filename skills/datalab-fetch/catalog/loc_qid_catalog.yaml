# ── 전국 평균이 함께 오는 지표들 ──────────────────────────────
# 아래 여섯은 기존 지표(LN_02_01_012 · LN_02_01_011_002)와 같은 값을
# 주면서 **전국 기초지자체별 평균을 한 행 더 얹어 준다.** 값이 같은
# 것은 대조해 확인했다(강릉시 2024-01~03 체류시간 2039·1952·2697,
# 숙박비율 25.2·32.4·22.1이 양쪽에서 일치).
#
# 그래서 "강릉시 체류시간 2,039분"이 아니라 "전국 평균 1,147분의
# 1.8배"라고 말할 수 있다. 지역 리포트에서 절대값보다 이쪽이 먼저
# 필요할 때가 많다.
#
# **TOU_DIV_NM으로 두 행이 갈린다.** 걸러 내지 않고 평균을 내면
# 전국 평균과 이 지역 값을 섞은 무의미한 수가 나온다.

