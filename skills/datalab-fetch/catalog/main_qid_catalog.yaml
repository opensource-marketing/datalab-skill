# 한국관광 데이터랩 qid 카탈로그 — 전국 요약(메인 화면)
#
# 데이터랩 첫 화면이 그리는 지표들이다. 다른 카탈로그가 "어느 지역·어느
# 국가"를 묻는 데 비해, 여기는 **전국 전체가 지금 어떤가**에 답한다.
# 그 층이 통째로 비어 있었다 — 색인이 화면 39개를 훑는 동안 정작 첫
# 화면(main/getMainForm)을 한 번도 훑지 않았기 때문이다.
#
# ── 이 계열의 성질 ─────────────────────────────────────────────
# 대부분 **파라미터를 받지 않거나 무시한다.** 화면이 "지금 전국"만
# 그리기 때문이다. 축을 주면 값이 달라질 것으로 기대하면 틀린다.
# 어느 것이 파라미터에 반응하는지는 실호출로 하나씩 확인했다:
#
#   반응한다   MN_01_01_027~031 (bgngYm/endYm) · TSA_03_01_0012 (BASE_YM1/2)
#              MM_HO_HOT_001_003 (BASE_YM_TMAP_FR/TO · AGEG_DIV_CD)
#   무시한다   MN_01_01_020 · MN_01_01_023 · MN_01_01_024 · MN_01_01_026
#              MM_HO_HOT_001_001 · _002 · _004
#
# ── 기간 파라미터 이름이 다르다 ────────────────────────────────
# 이 계열의 월별 추이는 BASE_YM1/BASE_YM2가 아니라 **bgngYm/endYm**을
# 본다. BASE_YM1을 주면 오류가 아니라 빈 배열이 온다. 다른 카탈로그의
# 습관대로 부르면 "데이터가 없다"로 잘못 읽힌다.
#
# ── DIV_NM은 코드다. 이름이 응답에 없다 ────────────────────────
# MN_01_01_026과 MN_01_01_023은 지표 이름을 돌려주지 않고 DIV_NM 코드만
# 준다. 무엇이 무엇인지는 사이트 화면이 그 코드로 어느 칸을 채우는지로만
# 알 수 있다. 지어내지 않았다 — 코드 → 이름 표는 scripts/national.py의
# CARDS에 있고, 근거는 main.html의 statusItemVal<코드> 라벨과
# main_*.js의 stdStr 문자열이다.
#
# ── 액수 단위 ─────────────────────────────────────────────────
# 소비액은 모두 **원**이다. 조 단위 숫자가 그대로 온다(2026년 내국인
# 관광소비 연간누적 93,664,351,622,807). 다른 카탈로그에는 천원·백만원
# 단위 지표가 섞여 있으니 나란히 놓기 전에 단위를 맞춰라.
# ────────────────────────────────────────────────────────────────

MN_01_01_026:
  name: 전국 관광 현황 요약(25종)
  screen: /datalab/portal/main/getMainForm.do
  auth: public
  params: []
  fixed_params: {}
  granularity: snapshot
  section: 전국요약
  query_axis: 전국
  caution: >-
    파라미터를 받지 않는다. DIV_NM이 지표 코드이고 이름은 응답에 없다 —
    national.py의 CARDS로 풀어라. 지표마다 기준 시점(MAX_BASE_YM)이
    다르므로 한 시점으로 뭉뚱그리지 마라. VALUE가 0인 행은 값이 없는
    것이 아니라 ARR_VAL에 상위 항목 목록이 JSON 문자열로 들어 있는 행이다.
  columns:
    DIV_NM: {label: 지표코드, type: str, unit: ""}
    VALUE: {label: 값, type: float, unit: ""}
    RATE: {label: 증감률, type: float, unit: ""}
    RATE1: {label: 보조_증감률, type: float, unit: ""}
    MAX_BASE_YM: {label: 기준시점, type: str, unit: ""}
    ARR_VAL: {label: 상위항목_JSON, type: str, unit: ""}

MN_01_01_023:
  name: 전국 관광 5대 지표(연간 누적)
  screen: /datalab/portal/main/getMainForm.do
  auth: public
  params: []
