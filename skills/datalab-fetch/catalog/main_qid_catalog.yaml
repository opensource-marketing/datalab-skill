TSA_03_01_0012:
  name: 시도별 체류시간·숙박일·숙박비율
  screen: /datalab/portal/main/getMainForm.do
  auth: public
  params: [BASE_YM1, BASE_YM2]
  fixed_params: {}
  granularity: period
  section: 전국비교
  query_axis: 전국
  caution: >-
    SGG_CD를 받는 것처럼 보이지만 무시한다 — 어느 지역을 넣어도 전국이
    모두 온다. 기간(BASE_YM1·BASE_YM2)에는 반응하며 없으면 빈 배열이다.
    **지금은 시도 17개가 한 번씩 온다**(2026-08-23 재확인: 2019·2021·2023·
    2024·2025 모두 17행이며 월 단위도 같다). 한때 '전남광주통합특별시'(코드
    12)가 '광주광역시'(29)·'전라남도'(46)와 함께 와 다 더하면 그 지역을 두
    번 세게 만들었다 — 지금은 오지 않지만 합계를 낼 때 코드 12가 섞였는지
    확인하라. STAY_TM과 SIDO_AVG_STAY_TM은 자릿수가 크게 다르고 사이트가
    단위를 표기하지 않는다 — 절대값으로 읽지 말고 시도 간 비교에만 써라.
  columns:
    SIDO_CD: {label: 시도코드, type: str, unit: ""}
    SIDO_NM: {label: 시도명, type: str, unit: ""}
    STAY_TM: {label: 체류시간, type: float, unit: ""}
