  section: 전국요약
  query_axis: 전국
  caution: >-
    BASE_YM1·BASE_YM2를 받는 것처럼 보이지만 무시한다(창을 2023년으로
    바꿔도 응답이 한 글자도 달라지지 않는다). DIV_NM 1~5는 각각 외지인
    방문자수·내국인 관광소비·방한 외래객수·외국인 관광소비·관광사업체
    수다. 출처가 서로 다르다(통신·카드·한국관광통계·카드·인허가)므로
    같은 잣대로 비교하지 마라.
  columns:
    DIV_NM: {label: 지표코드, type: str, unit: ""}
    VALUE: {label: 연간누적값, type: float, unit: ""}
    PRE_VALUE: {label: 전년동기값, type: float, unit: ""}
    RATE: {label: 증감률, type: float, unit: "%"}
    MAX_BASE_YM: {label: 기준시점, type: str, unit: ""}

