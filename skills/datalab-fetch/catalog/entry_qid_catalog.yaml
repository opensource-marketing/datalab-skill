# 한국관광 데이터랩 qid 카탈로그 — 방한 외래관광객 전국 통계
#
# 화면 셋이다.
#   ts/getEntcnyFrgnCust2Form  방한 외래관광객(성별·연령·목적·공항)
#   nat/getForTourForm         방한여행 현황(관광수입·대륙별·이미지)
#   nat/getForAirForm          항공 좌석·승객
#   ts/getTourCplnForm         해외 한국 이미지 조사(TAE_06_01_*)
#
# 마지막 줄이 이상해 보이지만 근거가 있다. **관광불편신고 화면의 JS
# (`tour_cpln.js`)가 `TAE_06_01_001` 을 부른다.** 화면 코드가 여러
# 곳에 재사용된 것으로 보이며, 데이터는 불편신고와 아무 상관이 없다.
#
# **인바운드 카탈로그(qid_catalog.yaml)와 나눈 이유가 있다.** 그쪽은
# 국가별 점수를 매기는 다섯 축(volume·momentum·value·access·headroom)
# 을 지표마다 달고 있다. 여기 지표들은 국가 축이 없는 전국 월별
# 통계라 그 축을 달 수 없다 — 달았다면 국가 점수에 뜻 없는 값이
# 섞였을 것이다.
#
# ── 컬럼 이름에 뜻이 없다 ───────────────────────────────────────
# `TOU_NUM1`·`TOU_NUM2`… 로만 온다. 무엇이 무엇인지는 **화면 HTML 이
# 정의한 상수**가 근거다. 지어낸 것이 아니다.
#
#   colSex          ['남성','여성','승무원','전체']
#   colAge          ['20세 이하','21~30세','31~40세','41~50세',
#                    '51~60세','61세이상','승무원','전체']
#   colAgeNew       ['0~9세','10~19세','20~29세','30~39세','40~49세',
#                    '50~59세','60~69세','70~79세','80세이상',
#                    '승무원','전체']
#   colTarget       ['관광','상용','공용','유학연수','기타','전체']
#   colTransferNew2 ['인천공항','김해공항','김포공항','대구공항',
#                    '무안공항','양양공항','청주공항','부산항구',
#                    '인천항구','기타항구','기타공항','제주항구',
#                    '서귀포항구','속초항구','여수항구','제주공항','전체']
#
# **'전체'는 응답에 오지 않는다.** 마지막 이름을 빼고 순서대로 짝지으면
# 된다. 다섯 지표의 갈래를 다 더하면 같은 값이 나온다 — 2024년 1월
# 880,881명으로 다섯이 모두 일치했다(2026-08-24 검산).
#
# ── 승무원이 섞여 있다 ──────────────────────────────────────────
# 성별·연령 분해의 마지막 갈래가 '승무원'이다. 관광객이 아니다.
# "남녀 비율"을 말할 때 승무원을 빼야 한다 — 2024년 1월 승무원이
# 71,265명으로 전체의 8%다.
#
# ── 환율과 유가가 같은 표에 실려 있다 ───────────────────────────
# `TOU_NUM21` 은 **원/달러 환율**, `TOU_NUM31` 은 **달러/배럴 국제
# 유가**다(화면이 두 값을 보조축으로 그린다 — 차트 단위 문자열이
# '원/달러'와 '달러/배럴'이다). 방문자 수가 아니다.
# `_MIN`·`_MAX` 는 **조회 기간 전체의 최소·최대가 모든 행에 반복된
# 것**이다(2024년 열두 달 모두 1319.6/1470.0). 그 달의 값이 아니다.
#
# ── 넣지 않은 것 ────────────────────────────────────────────────
# `TS_01_16_004`(교통수단 구버전)와 `TS_01_16_004_NEW` 는 뺐다.
# 값은 오지만 갈래 수가 화면 상수와 맞지 않는다(004는 9갈래인데
# colTransfer 는 12개다). 어느 항구가 어느 자리인지 확정할 수 없어
# 그럴듯한 남의 숫자가 될 위험이 있다. 지금 화면이 쓰는 것은
# `_NEW2` 다.

TS_01_16_001:
  name: 방한 외래관광객 성별(월별)
  screen: /datalab/portal/ts/getEntcnyFrgnCust2Form.do
  auth: public
  params: [BASE_YM1, BASE_YM2]
  fixed_params: {ALL_YN: "Y"}
  granularity: month
  section: 규모
  query_axis: 전국
  caution: >-
    TOU_NUM1 남성 · TOU_NUM2 여성 · TOU_NUM3 **승무원**이다(화면
    상수 colSex 가 근거). 셋을 더하면 그 달의 방한 외래객 전체다
    (2024년 1월 880,881명, 2026-08-24 검산). **승무원은 관광객이
    아니다** — 남녀 비율을 낼 때 빼라(2024년 1월 8%).
    TOU_NUM21 은 원/달러 환율, TOU_NUM31 은 달러/배럴 국제유가이며
    _MIN·_MAX 는 조회 기간 전체의 최소·최대가 행마다 반복된 값이다.
  columns:
    BASE_YM: {label: 기준월, type: str, unit: ""}
    TOU_NUM1: {label: 남성, type: float, unit: 명}
    TOU_NUM2: {label: 여성, type: float, unit: 명}
    TOU_NUM3: {label: 승무원, type: float, unit: 명}
    TOU_NUM21: {label: 원달러_환율, type: float, unit: 원}
    TOU_NUM21_MIN: {label: 기간_환율_최소, type: float, unit: 원}
    TOU_NUM21_MAX: {label: 기간_환율_최대, type: float, unit: 원}
    TOU_NUM31: {label: 국제유가, type: float, unit: 달러}
    TOU_NUM31_MIN: {label: 기간_유가_최소, type: float, unit: 달러}
    TOU_NUM31_MAX: {label: 기간_유가_최대, type: float, unit: 달러}

