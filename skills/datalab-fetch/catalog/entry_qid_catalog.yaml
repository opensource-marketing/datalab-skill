# 2026-08-24 추가 — 방한여행 현황과 항공
#
# ── 같은 모집단인지 산술로 확인했다 ─────────────────────────────
# 2024년 방한 외래객이 **16,369,629명**인 것을 세 지표가 서로 다른
# 방식으로 확인해 준다.
#   TS_01_16_001 성별 세 갈래 합         16,369,629
#   NAT_08_01_011 대륙 일곱 갈래 합      16,369,629
#   NAT_07_01_006 공항·항구 아홉 갈래 합 16,369,629
# 비율(TOU_NUM_RATE) 합도 각각 100.0 이다(2026-08-24 검산).
#
# ── 넣지 않은 것 ────────────────────────────────────────────────
# `NAT_08_01_008`(관광수지)은 아웃바운드 카탈로그의 `NAT_05_01_004`
# 와 값이 같다(DIV_NM 컬럼 하나만 없다). 같은 것을 두 벌 두지 않았다.
#
# `NAT_10_02_004`(입국목적별)는 뺐다. 2024년 합이 14,026,315명으로
# 방한 외래객 16,369,629명과 맞지 않고, 승무원(1,141,209)을 빼도
# 공항 입국자(14,547,078)와 맞춰도 어긋난다. **무엇을 센 것인지
# 확정하지 못했다.** 같은 '입국목적별'인 TS_01_16_003 과 관광 비중이
# 87.7% 대 82.4% 로 달라, 둘을 섞으면 어느 쪽이든 틀린 값이 실린다.
# ─────────────────────────────────────────────────────────────────

