    관광수입은 백만 달러, 1인당은 달러다. IMP_PSON_NUM 은 방한
    외래객 수이며 TS_01_16_* 의 갈래 합과 같다(2024년 1월 880,881명).
    **승무원과 비관광 목적 입국자가 분모에 들어 있다** — "관광객
    1인당 지출"이 아니다.
  columns:
    BASE_DATE: {label: 기준월, type: str, unit: ""}
    IMP_INTL_BALC_AMT: {label: 관광수입, type: float, unit: 백만달러}
    IMP_PSON_NUM: {label: 방한객수, type: float, unit: 명}
    VAL3: {label: 1인당_관광수입, type: float, unit: 달러}

NAT_08_01_011:
  name: 대륙별 방한 외래객
  screen: /datalab/portal/nat/getForTourForm.do
  auth: public
  params: [BASE_YM1, BASE_YM2]
